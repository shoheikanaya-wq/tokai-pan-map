name: Patch main distribution resilience

on:
  push:
    paths:
      - 'main-resilience-v114-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Ver.1.14 resilience patch
        run: python scripts/patch_main_resilience_v114.py
      - name: Commit update
        run: |
          git config user.name "tokai-pan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Release Ver.1.14 retryable loading errors"
          git push

name: Patch Gifu phase 2

on:
  push:
    paths:
      - 'gifu-phase2-v117-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Ver.1.17 Gifu expansion
        run: python scripts/patch_gifu_phase2_v117.py
      - name: Commit update
        run: |
          git config user.name "tokai-pan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Release Ver.1.17 Gifu TOP10 and city expansion"
          git push

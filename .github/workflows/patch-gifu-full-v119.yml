name: Patch Gifu full municipality coverage

on:
  push:
    paths:
      - 'gifu-full-v119-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Ver.1.19 full Gifu patch
        run: python scripts/patch_gifu_full_v119.py
      - name: Commit update
        run: |
          git config user.name "tokai-pan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Release Ver.1.19 full Gifu municipality coverage"
          git push

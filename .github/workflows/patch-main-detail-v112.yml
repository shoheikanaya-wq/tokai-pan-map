name: Patch main practical shop detail

on:
  push:
    paths:
      - 'main-detail-v112-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Ver.1.12 detail patch
        run: python scripts/patch_main_detail_v112.py
      - name: Commit update
        run: |
          git config user.name "tokai-pan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Release Ver.1.12 practical shop detail"
          git push

name: Patch Mie full municipality coverage

on:
  push:
    paths:
      - 'mie-full-v121-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Ver.1.21 full Mie patch
        run: python scripts/patch_mie_full_v121.py
      - name: Commit update
        run: |
          git config user.name "tokai-pan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Release Ver.1.21 full Mie municipality coverage"
          git push

name: Patch Pan Rush Tokai expansion

on:
  push:
    paths:
      - 'panrush-tokai-v123-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Ver.1.23 Pan Rush Tokai expansion
        run: python scripts/patch_panrush_tokai_v123.py
      - name: Commit update
        run: |
          git config user.name "tokai-pan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html panrush.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Release Ver.1.23 Pan Rush Tokai expansion"
          git push

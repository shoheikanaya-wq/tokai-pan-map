name: Patch main distinct shop features

on:
  push:
    paths:
      - 'main-features-v115-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Ver.1.15 feature copy patch
        run: python scripts/patch_main_features_v115.py
      - name: Commit update
        run: |
          git config user.name "tokai-pan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Release Ver.1.15 distinct shop features"
          git push

name: Repair normal MAP city/photo recovery v128
on:
  push:
    paths:
      - 'map-repair-v128-trigger.txt'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch normal MAP recovery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace("const BAKERY_CACHE_VERSION = 'v2';","const BAKERY_CACHE_VERSION = 'v3';")
          old="""loadedShops = loadedShops.filter(isBakeryCandidate);
  loadedShops = loadedShops.filter(s => String(s.address||'').includes(prefecture) && municipalityMatches(s.address,city));
  loadedShops.sort((a, b) =>
    b.score - a.score || b.reviews - a.reviews
  );
  writeBakeryCache(prefecture,city, loadedShops);
  return loadedShops;"""
          new="""loadedShops = loadedShops.filter(isBakeryCandidate);
  const exactMunicipality = loadedShops.filter(s => municipalityMatches(s.address,city));
  const prefectureMatches = loadedShops.filter(s => String(s.address||'').includes(prefecture));
  // GoogleのformattedAddress表記揺れで全件0件になる場合でも、検索クエリ自体が
  // prefecture+cityに限定されているため候補を捨てず、画面を開けることを優先する。
  loadedShops = exactMunicipality.length ? exactMunicipality
    : (prefectureMatches.length ? prefectureMatches : loadedShops);
  loadedShops.sort((a, b) =>
    b.score - a.score || b.reviews - a.reviews
  );
  if(!loadedShops.length) throw new Error('パン屋候補が0件でした');
  writeBakeryCache(prefecture,city, loadedShops);
  return loadedShops;"""
          if old not in s: raise SystemExit('loadBakeries target not found')
          s=s.replace(old,new,1)
          oldphoto="""const photo = s.photo
      ? `<img src="${escapeHtml(s.photo)}" alt="${escapeHtml(s.photoAlt)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade">`
      : '<span aria-hidden="true">🥐</span>';"""
          newphoto="""const photo = s.photo
      ? `<img src="${escapeHtml(s.photo)}" alt="${escapeHtml(s.photoAlt)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" onerror="this.remove();this.parentElement.innerHTML='<span aria-hidden=\\'true\\'>🥐</span>'">`
      : '<span aria-hidden="true">🥐</span>';"""
          if oldphoto not in s: raise SystemExit('photo target not found')
          s=s.replace(oldphoto,newphoto,1)
          s=s.replace('<div>Ver.1.27</div>：三県の市町村キャッシュ分離、東海三県TOP10の地域判定・配置、画面履歴を改善しました。電話番号は表示専用、パンラッシュは愛知県内限定を継続します。',
                      '<div>Ver.1.28</div>：市町村リンクの取得復旧と店舗写真の失敗時表示を改善しました。電話番号は表示専用、パンラッシュは愛知県内限定を継続します。')
          p.write_text(s)
          sw=Path('sw.js')
          w=sw.read_text().replace("const CACHE_NAME = 'tokai-pan-v29';","const CACHE_NAME = 'tokai-pan-v30';")
          sw.write_text(w)
          PY
      - name: Check inline JavaScript and constraints
        run: |
          python3 - <<'PY'
          import re
          s=open('index.html').read()
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          open('/tmp/index-inline.js','w').write('\n'.join(scripts))
          assert "BAKERY_CACHE_VERSION = 'v3'" in s
          assert 'Ver.1.28' in s
          assert 'tel:' not in s
          assert "tokai-pan-v30" in open('sw.js').read()
          PY
          node --check /tmp/index-inline.js
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "fix: restore municipality results and photo fallback" || exit 0
          git push

name: Patch phone display only Ver.1.26
on:
  push:
    paths:
      - 'phone-display-v126-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make phone number display-only
        run: python scripts/patch_phone_display_only_v126.py
      - name: Commit update
        run: |
          git config user.name "tokai-pan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Release Ver.1.26 phone display only"
          git push

name: Rush brand visual sync

on:
  push:
    paths:
      - 'scripts/sync-rush-brand-visual.py'
      - '.github/workflows/rush-brand-visual.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Add shared Tokai Pan visual to rush pages
        run: python scripts/sync-rush-brand-visual.py
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add panrush.html autumn-rush.html
          git commit -m "ui: show Tokai Pan characters on rush pages"
          git push

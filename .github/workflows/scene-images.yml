name: Scene image uniqueness
on:
  push:
    paths:
      - 'data/scene-images.json'
      - 'assets/scenes/**'
      - 'scripts/check-scene-images.py'
      - '.github/workflows/scene-images.yml'
  pull_request:
    paths:
      - 'data/scene-images.json'
      - 'assets/scenes/**'
      - 'scripts/check-scene-images.py'
      - '.github/workflows/scene-images.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check scene image assignments
        run: python scripts/check-scene-images.py

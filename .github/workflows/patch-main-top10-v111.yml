name: Patch main TOP10 candidate precision

on:
  push:
    paths:
      - 'main-top10-v111-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Ver.1.11 candidate precision patch
        run: python scripts/patch_main_top10_v111.py
      - name: Commit update
        run: |
          git config user.name "tokai-pan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Release Ver.1.11 precise municipality bakery candidates"
          git push

name: Patch Gifu phase 1

on:
  push:
    paths:
      - 'gifu-phase1-v116-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Ver.1.16 Gifu phase 1
        run: python scripts/patch_gifu_phase1_v116.py
      - name: Commit update
        run: |
          git config user.name "tokai-pan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Release Ver.1.16 Gifu phase 1"
          git push

name: Patch Pan Rush 24h opening windows

on:
  push:
    paths:
      - 'panrush-24h-hours-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add future opening windows and waiting logic
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('panrush.html')
          s=p.read_text(encoding='utf-8')

          old="function parseMinutesText(t){if(!t)return null;let m=String(t).match(/(\\d{1,2})[:：](\\d{2})/);return m?(+m[1]*60 + +m[2]):null}function todayClose(p){let w=p.currentOpeningHours?.weekdayDescriptions||p.regularOpeningHours?.weekdayDescriptions||[];if(!w.length)return null;let d=new Date().getDay(),idx=(d+6)%7,line=w[idx]||'';if(/24\\s*時間|24 hours/i.test(line))return 24*60;let parts=line.split(/[–—-]/);if(parts.length<2)return null;return parseMinutesText(parts[parts.length-1])}function arrivalRisk(p,base,elapsed){let c=todayClose(p);if(c==null)return{txt:'営業時間要確認',cls:'risk-unknown'};let [h,m]=base.split(':').map(Number),arr=(h*60+m+elapsed)%1440,delta=c-arr;if(delta<0)return{txt:'閉店後の可能性',cls:'risk-bad'};if(delta<=30)return{txt:'閉店まで30分以内',cls:'risk-warn'};return{txt:'営業内見込み',cls:'risk-ok'}}"
          new="function parseMinutesText(t){if(!t)return null;let m=String(t).match(/(\\d{1,2})[:：](\\d{2})/);return m?(+m[1]*60 + +m[2]):null}function dayLines(p){return p.currentOpeningHours?.weekdayDescriptions||p.regularOpeningHours?.weekdayDescriptions||[]}function parseDayWindows(line){if(!line)return[];if(/休業|定休日|Closed/i.test(line))return[];if(/24\\s*時間|24 hours/i.test(line))return[[0,1440]];let tail=String(line).replace(/^[^:：]+[:：]\\s*/,'');let out=[];for(let part of tail.split(/[,、]/)){let m=part.match(/(\\d{1,2})[:：](\\d{2})\\s*[–—-]\\s*(\\d{1,2})[:：](\\d{2})/);if(!m)continue;let a=+m[1]*60 + +m[2],b=+m[3]*60 + +m[4];if(b<=a)b+=1440;out.push([a,b])}return out}function openingWindows24(p,base){let lines=dayLines(p);if(!lines.length)return[];let now=new Date(),today=(now.getDay()+6)%7,[bh,bm]=base.split(':').map(Number),start=bh*60+bm,out=[];for(let dd=0;dd<2;dd++){let idx=(today+dd)%7;for(let [a,b] of parseDayWindows(lines[idx]||'')){let oa=dd*1440+a-start,ob=dd*1440+b-start;if(ob<0)continue;out.push([oa,ob])}}return out.sort((x,y)=>x[0]-y[0])}function visitWindow(p,base,arrival){let w=openingWindows24(p,base);if(!w.length)return{wait:0,openAt:arrival,closeAt:null,state:'unknown'};for(let [a,b] of w){if(arrival>=a&&arrival<=b)return{wait:0,openAt:arrival,closeAt:b,state:'open'};if(arrival<a)return{wait:a-arrival,openAt:a,closeAt:b,state:'wait'}}return{wait:0,openAt:arrival,closeAt:null,state:'closed'}function arrivalRisk(p,base,arrival){let v=visitWindow(p,base,arrival);if(v.state==='unknown')return{txt:'営業時間要確認',cls:'risk-unknown',wait:0};if(v.state==='closed')return{txt:'24時間内の営業枠なし',cls:'risk-bad',wait:0};if(v.state==='wait')return{txt:'開店待ち '+v.wait+'分',cls:'risk-warn',wait:v.wait};let delta=v.closeAt-v.openAt;if(delta<=30)return{txt:'閉店まで30分以内',cls:'risk-warn',wait:0};return{txt:'営業内見込み',cls:'risk-ok',wait:0}}"
          if old not in s:
              raise SystemExit('hours helper block not found')
          s=s.replace(old,new,1)

          old2="let risk=arrivalRisk(p,base,elapsed);if(risk.cls==='risk-bad')bad++;if(risk.cls==='risk-warn')warnCount++;let riskLabel=risk.cls==='risk-bad'?'除外候補：'+risk.txt:risk.txt;html+='<div class=\\\"route\\\"><strong>'+(i+1)+'. '+esc(p.displayName?.text)+'</strong><div class=\\\"small\\\">'+esc(p._city)+' ／ '+openBadge(p)+' ／ <span class=\\\"time\\\">到着 '+tm(base,elapsed)+'</span>'+(km!=null?' ／ 約'+km.toFixed(1)+'km':'')+' ／ 滞在 '+stay+'分 <span class=\\\"risk-chip '+risk.cls+'\\\">'+esc(riskLabel)+'</span></div></div>';elapsed+=stay;"
          new2="let rawArrival=elapsed,risk=arrivalRisk(p,base,rawArrival);if(risk.wait)elapsed+=risk.wait;if(risk.cls==='risk-bad')bad++;if(risk.cls==='risk-warn')warnCount++;let riskLabel=risk.cls==='risk-bad'?'除外候補：'+risk.txt:risk.txt;html+='<div class=\\\"route\\\"><strong>'+(i+1)+'. '+esc(p.displayName?.text)+'</strong><div class=\\\"small\\\">'+esc(p._city)+' ／ '+openBadge(p)+' ／ <span class=\\\"time\\\">到着 '+tm(base,rawArrival)+'</span>'+(risk.wait?' ／ 開店待ち '+risk.wait+'分 → 入店 '+tm(base,elapsed):'')+(km!=null?' ／ 約'+km.toFixed(1)+'km':'')+' ／ 滞在 '+stay+'分 <span class=\\\"risk-chip '+risk.cls+'\\\">'+esc(riskLabel)+'</span></div></div>';elapsed+=stay;"
          if old2 not in s:
              raise SystemExit('plan risk block not found')
          s=s.replace(old2,new2,1)

          old3="close=todayClose(p),arr=(bh*60+bm+elapsed+travel)%1440,slack=close==null?9999:close-arr;let urgency=0;if(slack<0)urgency=5000;else if(slack<=30)urgency=-1200;else if(slack<=90)urgency=-650;else if(slack<=180)urgency=-250;let s=km*12+urgency;"
          new3="visit=visitWindow(p,base,elapsed+travel),slack=visit.closeAt==null?9999:visit.closeAt-Math.max(elapsed+travel,visit.openAt);let urgency=visit.state==='closed'?5000:visit.state==='wait'?Math.min(1800,visit.wait*8):0;if(visit.state==='open'&&slack<=30)urgency-=1200;else if(visit.state==='open'&&slack<=90)urgency-=650;else if(visit.state==='open'&&slack<=180)urgency-=250;let s=km*12+urgency;"
          if old3 not in s:
              raise SystemExit('route order block not found')
          s=s.replace(old3,new3,1)

          s=s.replace('現在は直線距離ベースの概算。実道路、渋滞、休憩、売り切れ、臨時休業、駐車・入店待ちを含めると実時間は増えます。24時間判定は暫定シミュレーションです。','現在は直線距離ベースの概算。営業時間は今日＋翌日を参照し、閉店中なら次の開店までの待ち時間を加算します。実道路、渋滞、休憩、売り切れ、臨時休業、駐車・入店待ちは未反映です。')
          s=s.replace('距離だけでなく、閉店時刻へ間に合う可能性を優先して並べます。閉店後見込みの店は「除外候補」として表示します。','距離だけでなく、今日＋翌日の営業枠と開店待ちを考慮して並べます。24時間内に営業枠が見つからない店は「除外候補」として表示します。')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "tokai-pan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add panrush.html
          git diff --cached --quiet && exit 0
          git commit -m "Handle next-day opening windows and wait times in Pan Rush"
          git push

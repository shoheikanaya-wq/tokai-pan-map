<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7a4b20">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>ぷらっとSA・PA 道の駅</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#f3efe6;color:#2b2118;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;overscroll-behavior-y:none}
.app{height:100dvh;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
header{flex:none;background:#7a4b20;color:#fff;padding:8px 12px;display:flex;align-items:center;gap:10px}
header a,header button{color:#fff;text-decoration:none;font-weight:900;font-size:15px;padding:6px 10px;border:2px solid #fff;border-radius:12px;background:transparent;font-family:inherit}
header h1{margin:0;font-size:clamp(17px,4.8vw,21px);flex:1;line-height:1.2}
.prefs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 8px 0}
.prefs button,.kinds button{min-height:44px;border-radius:12px;background:#fff;border:2px solid #cdb995;color:#5a3714;font-weight:900;font-size:16px;font-family:inherit}
.prefs button.on{background:#7a4b20;color:#fff;border-color:#7a4b20}
.kinds{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px 8px 0}
.kinds button{min-height:38px;font-size:14px;border-radius:999px}
.kinds button.on{background:#efe3c9;border-color:#7a4b20}
.stage{flex:1;min-height:0;padding:8px;display:flex}
.panel{flex:1;min-height:0;overflow:auto;background:#fff;border-radius:16px;border:2px solid #e2d6bd;padding:4px 12px 10px}
.grp{position:sticky;top:-4px;background:#fff;margin:0;padding:10px 0 6px;font-size:15px;color:#7a4b20;border-bottom:2px solid #efe3c9;z-index:1}
.row{display:flex;align-items:center;gap:8px;width:100%;padding:11px 2px;border:0;border-bottom:1px solid #eee3cc;background:none;text-align:left;font-family:inherit;font-size:17px;font-weight:800;color:#3b2511;cursor:pointer}
.row .nm{flex:1;min-width:0}
.row small{font-weight:700;color:#8a7c6b;font-size:13px;white-space:nowrap}
.k{flex:none;font-size:12px;font-weight:900;border-radius:8px;padding:2px 6px;color:#fff;min-width:44px;text-align:center}
.k.SA{background:#2f6b8f}.k.PA{background:#4f8a4a}.k.michi{background:#b5481f}
.dir{font-size:12px;font-weight:800;background:#efe3c9;color:#5a3714;border-radius:8px;padding:2px 6px;white-space:nowrap}
.card{display:flex;flex-direction:column;min-height:100%}
.card h2{margin:8px 0 4px;font-size:clamp(20px,5.6vw,26px);color:#3b2511;line-height:1.25}
.meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:6px}
.area{font-size:13px;font-weight:800;background:#efe3c9;color:#5a3714;border-radius:8px;padding:2px 8px}
.road{font-size:14px;font-weight:800;color:#5a3714}
.cat{font-size:clamp(15px,4.2vw,18px);font-weight:700;margin:4px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0}
.chips span{background:#f3efe6;border-radius:999px;padding:3px 9px;font-size:14px;font-weight:700}
.hours{font-size:15px;line-height:1.45;margin:4px 0}
.addr{font-size:14px;color:#6b5a48;margin:4px 0}
.spacer{flex:1}
.btns{display:flex;gap:8px;margin-top:8px}
.btns a{flex:1;text-align:center;min-height:50px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#7a4b20;color:#fff;font-weight:900;font-size:17px;text-decoration:none}
.btns a.sub{background:#fff;color:#7a4b20;border:2px solid #7a4b20}
.note{font-size:12px;color:#8a7c6b;margin:8px 0 0;line-height:1.4}
.pager{flex:none;display:flex;align-items:center;gap:8px;padding:0 8px calc(10px + env(safe-area-inset-bottom))}
.pager button{min-height:52px;font-size:17px;font-weight:900;border-radius:14px;border:0;background:#7a4b20;color:#fff;flex:1;font-family:inherit}
.pager button:disabled{background:#cdb995}
.pager[hidden]{display:none}
.pager .n{flex:none;min-width:64px;text-align:center;font-weight:900;font-size:16px;color:#5a3714}
.empty{text-align:center;font-size:17px;font-weight:800;color:#6b5a48;padding:30px 10px}
button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:active,.btns a:active{filter:brightness(.92)}
</style>
</head>
<body>
<div class="app">
 <header>
  <a href="index.html" id="back" aria-label="ぷらっと東海へ戻る">← もどる</a>
  <h1>🛣 ぷらっとSA・PA 道の駅</h1>
 </header>
 <nav class="prefs" id="prefs" aria-label="県をえらぶ"></nav>
 <nav class="kinds" id="kinds" aria-label="種類をえらぶ"></nav>
 <div class="stage"><div class="panel" id="panel"><p class="empty">読みこみ中…</p></div></div>
 <div class="pager" id="pager" hidden>
  <button id="prev">◀ 前へ</button><span class="n" id="pos"></span><button id="next">次へ ▶</button>
 </div>
</div>
<script>
(function(){
  var PREFS=['愛知県','岐阜県','三重県','静岡県'];
  var KINDS=[['all','すべて'],['SA','SA'],['PA','PA'],['michi','道の駅']];
  var ROADS=['東名高速道路','新東名高速道路','伊勢湾岸自動車道','名神高速道路','新名神高速道路','中央自動車道','東海北陸自動車道','東海環状自動車道','東名阪自動車道','伊勢自動車道','紀勢自動車道'];
  var q=new URLSearchParams(location.search);
  var pref=PREFS.indexOf(q.get('pref'))>=0?q.get('pref'):'愛知県';
  var kind=['all','SA','PA','michi'].indexOf(q.get('kind'))>=0?q.get('kind'):'all';
  var all=[],view=[],cur=-1,notes={};
  var $=function(id){return document.getElementById(id)};
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function safeUrl(u){return /^https:\/\//.test(u||'')?u:''}
  function kcls(x){return x.kind==='道の駅'?'michi':x.kind}
  function load(u){return fetch(u,{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json()}).catch(function(){return null})}
  Promise.all([load('data/sapa.json'),load('spots-michi.json')]).then(function(r){
    if(r[0]){notes.sapa=r[0].attribution;r[0].shops.forEach(function(x){all.push(x)})}
    if(r[1]){notes.michi=r[1].attribution;r[1].shops.forEach(function(x){
      var p=PREFS.filter(function(P){return (x.address||'').indexOf(P)===0})[0];
      if(!p)return;
      all.push({placeId:x.placeId,name:x.name,kind:'道の駅',pref:p,area:x.area,address:x.address,website:x.website,catchphrase:x.catchphrase,highlights:x.highlights,openingHours:x.openingHours});
    })}
    if(!all.length){$('panel').innerHTML='<p class="empty">データを読みこめませんでした。<br>時間をおいて開き直してください。</p>';return}
    render();
  });
  function setUrl(){var u='?pref='+encodeURIComponent(pref)+(kind!=='all'?'&kind='+kind:'');history.replaceState(null,'',u)}
  function tabs(){
    $('prefs').innerHTML=PREFS.map(function(p){
      var n=all.filter(function(x){return x.pref===p}).length;
      return '<button data-p="'+p+'"'+(p===pref?' class="on" aria-pressed="true"':'')+'>'+p.replace('県','')+' <small>'+n+'</small></button>'}).join('');
    $('kinds').innerHTML=KINDS.map(function(k){return '<button data-k="'+k[0]+'"'+(k[0]===kind?' class="on" aria-pressed="true"':'')+'>'+k[1]+'</button>'}).join('');
  }
  function filtered(){
    var a=all.filter(function(x){return x.pref===pref&&(kind==='all'||kcls(x)===kind)});
    a.sort(function(x,y){
      var gx=x.kind==='道の駅'?99:ROADS.indexOf(x.road),gy=y.kind==='道の駅'?99:ROADS.indexOf(y.road);
      if(gx<0)gx=50;if(gy<0)gy=50;
      return gx-gy;
    });
    return a;
  }
  function render(){
    tabs();setUrl();view=filtered();cur=-1;$('pager').hidden=true;$('back').textContent='← もどる';
    if(!view.length){$('panel').innerHTML='<p class="empty">この県の'+(kind==='michi'?'道の駅':kind==='all'?'データ':kind)+'はまだ準備中です。</p>';return}
    var h='',g='';
    view.forEach(function(x,i){
      var grp=x.kind==='道の駅'?'🚗 道の駅':'🛣 '+x.road;
      if(grp!==g){h+='<h3 class="grp">'+esc(grp)+'</h3>';g=grp}
      h+='<button class="row" data-i="'+i+'"><span class="k '+kcls(x)+'">'+esc(x.kind)+'</span><span class="nm">'+esc(x.direction?x.name.replace(/[((][^))]*[))]$/,''):x.name)+'</span>'+
        (x.direction?'<span class="dir">'+esc(x.direction)+'</span>':'<small>'+esc(x.area)+'</small>')+'</button>';
    });
    $('panel').innerHTML=h;$('panel').scrollTop=0;
  }
  function show(i){
    cur=i;var x=view[i];if(!x)return;
    var map='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x.name.replace(/[((].*?[))]/g,' ')+' '+(x.address||''));
    var web=safeUrl(x.website);
    var h='<div class="card"><div class="meta"><span class="k '+kcls(x)+'">'+esc(x.kind)+'</span>'+
      (x.direction?'<span class="dir">'+esc(x.direction)+'</span>':'')+'<span class="area">'+esc(x.area)+'</span>'+
      (x.road?'<span class="road">'+esc(x.road)+'</span>':'')+'</div>'+
      '<h2>'+esc(x.name)+'</h2><div class="cat">'+esc(x.catchphrase)+'</div>'+
      '<div class="chips">'+(x.highlights||[]).map(function(t){return '<span>'+esc(t)+'</span>'}).join('')+'</div>'+
      (x.openingHours?'<div class="hours">🕒 '+x.openingHours.map(esc).join('<br>')+'</div>':'')+
      '<div class="addr">📍 '+esc(x.address)+'</div><div class="spacer"></div>'+
      '<div class="btns"><a href="'+map+'" target="_blank" rel="noopener">🗺 地図で見る</a>'+(web?'<a class="sub" href="'+esc(web)+'" target="_blank" rel="noopener">くわしく</a>':'')+'</div>'+
      '<p class="note">'+esc(x.kind==='道の駅'?notes.michi:notes.sapa)+'</p></div>';
    $('panel').innerHTML=h;$('panel').scrollTop=0;
    $('pager').hidden=false;$('pos').textContent=(i+1)+'/'+view.length;
    $('prev').disabled=i===0;$('next').disabled=i===view.length-1;
    $('back').textContent='← 一覧';
  }
  $('prefs').addEventListener('click',function(e){var b=e.target.closest('button');if(b){pref=b.dataset.p;render()}});
  $('kinds').addEventListener('click',function(e){var b=e.target.closest('button');if(b){kind=b.dataset.k;render()}});
  $('panel').addEventListener('click',function(e){var b=e.target.closest('.row');if(b)show(+b.dataset.i)});
  $('prev').onclick=function(){show(cur-1)};$('next').onclick=function(){show(cur+1)};
  $('back').addEventListener('click',function(e){if(cur>=0){e.preventDefault();render()}});
})();
</script>
</body>
</html>

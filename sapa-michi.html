<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7a4b20">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>ぷらっとSA・PA 道の駅</title>
<link rel="stylesheet" href="assets/puratto-main.css">
</head>
<body>
<div class="app">
 <header>
  <a href="index.html" id="back" aria-label="ぷらっと東海へ戻る">← もどる</a>
  <h1 id="title">🛣 ぷらっとSA・PA 道の駅</h1>
 </header>
 <nav class="prefs" id="prefs" aria-label="県をえらぶ"></nav>
 <nav class="kinds" id="kinds" aria-label="種類をえらぶ"></nav>
 <div class="stage"><div class="panel" id="panel"><p class="empty">読みこみ中…</p></div></div>
 <div class="pager" id="pager" hidden>
  <button id="prev">◀ 前へ</button><span class="n" id="pos"></span><button id="next">次へ ▶</button>
 </div>
</div>
<script>
window.PURATTO={
  title:'ぷらっとSA・PA 道の駅',emoji:'🛣',noun:'SA・PA・道の駅',
  sources:[{url:'data/sapa.json'},{url:'spots-michi.json',kind:'道の駅'}],
  kinds:[['all','すべて'],['SA','SA'],['PA','PA'],['michi','道の駅']],
  kindClass:function(x){return x.kind==='道の駅'?'michi':x.kind},
  group:function(x){return x.kind==='道の駅'?'道の駅':x.road},
  rowRight:function(x){return x.area},
  groupIcon:function(x){return x.kind==='道の駅'?'🚗':'🛣'},
  groupOrder:function(x){var R=['東名高速道路','新東名高速道路','伊勢湾岸自動車道','名神高速道路','新名神高速道路','中央自動車道','東海北陸自動車道','東海環状自動車道','東名阪自動車道','伊勢自動車道','紀勢自動車道'];if(x.kind==='道の駅')return 99;var i=R.indexOf(x.road);return i<0?50:i}
};
</script>
<script src="assets/puratto-main.js"></script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7a4b20">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preload" as="image" href="assets/home/puratto-tokai-home.webp">
<title>ぷらっと東海</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f9e9d9;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#5a3714}
.portal{min-height:100dvh;padding:0 0 18px}
.home{position:relative;width:min(100%,640px);margin:0 auto}
.home img{display:block;width:100%;height:auto}
.hit{position:absolute;z-index:2;display:block;margin:0;padding:0;border:0;border-radius:4.5%/12%;background:transparent;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background-color .08s ease,box-shadow .08s ease}
.hit:active{background:rgba(0,0,0,.16);box-shadow:inset 0 4px 10px rgba(0,0,0,.25)}
.hit:focus-visible{outline:4px solid #1a73e8;outline-offset:2px}
.copy{margin:14px 16px 0;text-align:center;font-size:12px;line-height:1.6;color:#8a6a4a}
.toast{position:fixed;left:50%;bottom:24px;z-index:9;max-width:calc(100% - 32px);padding:12px 18px;border-radius:999px;background:#5a3714;color:#fff;
  font-size:15px;font-weight:700;text-align:center;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){.hit,.toast{transition:none}}
</style>
<script data-goatcounter="https://puratto-tokai.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<main class="portal">
 <div class="home">
  <img src="assets/home/puratto-tokai-home.webp" width="1342" height="1832" alt="ぷらっと東海。食べて・見て・楽しむ 東海のおでかけMAP">
  <a class="hit" style="left:3.58%;top:37.66%;width:45.23%;height:15.72%" href="new-pan.html" aria-label="ぷらっとパンへ"></a>
  <a class="hit" style="left:51.27%;top:37.66%;width:45.08%;height:15.72%" href="ramen.html" aria-label="ぷらっとラーメンへ"></a>
  <a class="hit" style="left:3.58%;top:54.75%;width:45.23%;height:14.19%" href="onsen.html" aria-label="ぷらっと温泉へ"></a>
  <a class="hit" style="left:51.27%;top:54.75%;width:45.08%;height:14.19%" href="sapa-michi.html" aria-label="ぷらっと道の駅・SA・PAへ"></a>
  <a class="hit" style="left:3.58%;top:70.20%;width:45.23%;height:12.39%" href="zekkei.html" aria-label="ぷらっと絶景へ"></a>
  <a class="hit" style="left:51.27%;top:70.20%;width:45.08%;height:12.39%" href="fudosan.html" aria-label="ぷらっと不動産へ"></a>
  <button class="hit" type="button" style="left:3.58%;top:83.79%;width:45.23%;height:15.12%" data-soon="ぷらっと未来" aria-label="ぷらっと未来(準備中)"></button>
  <button class="hit" type="button" style="left:51.27%;top:83.79%;width:45.08%;height:15.12%" data-soon="ぷらっと秋田・青森・北海道" aria-label="ぷらっと秋田・青森・北海道(準備中)"></button>
 </div>
 <p class="copy">© 2026 ぷらっと東海</p>
</main>
<div class="toast" role="status" aria-live="polite"></div>
<script>
(function(){
  var toast=document.querySelector('.toast'),timer;
  document.querySelectorAll('[data-soon]').forEach(function(b){
    b.addEventListener('click',function(){
      toast.textContent=b.getAttribute('data-soon')+'は準備中です';
      toast.classList.add('show');clearTimeout(timer);
      timer=setTimeout(function(){toast.classList.remove('show')},2600);
    });
  });
})();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js?rev=20261117-178').catch(err => console.warn('SW registration failed', err));
  });
}
</script>
</body>
</html>

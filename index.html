<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7a4b20">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>ぷらっと東海</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f3efe6;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
.portal{min-height:100dvh;display:block;padding:0}
.hero{position:relative;width:min(100%,1200px);margin:auto}
.hero picture,.hero img{display:block;width:100%;height:auto}
.entry{position:absolute;bottom:2.2%;height:17%;z-index:2;border-radius:18px;text-indent:-9999px;overflow:hidden}
.entry:focus-visible{outline:5px solid #fff;outline-offset:-5px}
.pan{left:5%;width:43%}
.ramen{right:5%;width:43%}
@media(max-width:600px){
 .hero{width:100%;display:block}
 .hero picture,.hero img{display:block;width:100%;height:auto}
 .entry{bottom:.6%;height:12.5%}
 .pan{left:4%;width:44%}.ramen{right:4%;width:44%}
}

/* Shared tactile button feedback */
.entry{
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  transition:transform .08s ease,filter .08s ease,box-shadow .08s ease;
}
.entry:active,.entry[aria-pressed="true"]{
  transform:translateY(4px) scale(.985);
  filter:brightness(.92);
  box-shadow:inset 0 4px 10px rgba(0,0,0,.22);
}
@media(prefers-reduced-motion:reduce){.entry{transition:none}}

/* おでかけ(道の駅・日帰りドライブ・絶景名所・日帰り温泉) */
.more{width:min(100%,1200px);margin:0 auto;padding:14px 14px 28px}
.more h2{margin:0 0 10px;font-size:18px;color:#5a3714;text-align:center}
.more .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.more a{display:flex;align-items:center;justify-content:center;gap:6px;min-height:64px;padding:0 6px;text-align:center;border-radius:16px;
  background:#fff;border:3px solid #7a4b20;color:#5a3714;font-size:17px;line-height:1.3;word-break:keep-all;font-weight:900;text-decoration:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
.more a:active{transform:translateY(3px);filter:brightness(.94)}
@media(min-width:700px){.more .grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:699px){.more .grid a:last-child:nth-child(odd){grid-column:1/-1}}
</style>
</head>
<body>
<main class="portal">
 <div class="hero">
  <picture>
   <source media="(max-width:600px)" srcset="puratto-tokai-mobile.png">
   <img src="puratto-tokai-pc.png" alt="ぷらっと東海。パンとラーメンから選べます">
  </picture>
  <a class="entry pan" href="new-pan.html" aria-label="ぷらっとパンへ">ぷらっとパンへ</a>
  <a class="entry ramen" href="ramen.html" aria-label="ぷらっとラーメンへ">ぷらっとラーメンへ</a>
 </div>
 <nav class="more" aria-label="ぷらっと おでかけ">
  <h2>ぷらっと おでかけ</h2>
  <div class="grid">
   <a href="sapa-michi.html">🛣 ぷらっとSA・PA 道の駅</a>
   <a href="drive.html">🚙 ぷらっとドライブ</a>
   <a href="zekkei.html">🏞 ぷらっと絶景</a>
   <a href="onsen.html">♨ ぷらっと温泉</a>
   <a href="fudosan.html">🏠 ぷらっと不動産</a>
  </div>
 </nav>
</main>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js?rev=20261103-177').catch(err => console.warn('SW registration failed', err));
  });
}
</script>
</body>
</html>

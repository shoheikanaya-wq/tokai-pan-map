<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7a4b20">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>ぷらっと東海</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f3efe6;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
.portal{min-height:100dvh;display:grid;place-items:center;padding:0}
.hero{position:relative;width:min(100%,1200px);margin:auto}
.hero picture,.hero img{display:block;width:100%;height:auto}
.entry{position:absolute;bottom:2.2%;height:17%;z-index:2;border-radius:18px;text-indent:-9999px;overflow:hidden}
.entry:focus-visible{outline:5px solid #fff;outline-offset:-5px}
.pan{left:5%;width:43%}
.ramen{right:5%;width:43%}
@media(max-width:600px){
 .hero{width:100%;display:block}
 .hero picture,.hero img{display:block;width:100%;height:auto}
 .entry{bottom:.6%;height:12.5%}
 .pan{left:4%;width:44%}.ramen{right:4%;width:44%}
}
</style>
</head>
<body>
<main class="portal">
 <div class="hero">
  <picture>
   <source media="(max-width:600px)" srcset="puratto-tokai-mobile.png">
   <img src="puratto-tokai-pc.png" alt="ぷらっと東海。パンとラーメンから選べます">
  </picture>
  <a class="entry pan" href="new-pan.html" aria-label="ぷらっとパンへ">ぷらっとパンへ</a>
  <a class="entry ramen" href="ramen.html" aria-label="ぷらっとラーメンへ">ぷらっとラーメンへ</a>
 </div>
</main>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js?rev=20261009-174').catch(err => console.warn('SW registration failed', err));
  });
}
</script>
</body>
</html>

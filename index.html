<title>ぷらっと東海</title>
<style>
*{box-sizing:border-box}
html{background:#1f6fb8}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
/* 背景:同じ絵をぼかして全面に敷く(肌色の余白を出さない) */
body::before{content:"";position:fixed;inset:-30px;background:url(home-main.webp) center/cover;filter:blur(18px) brightness(.8);z-index:-1}
.app{height:100dvh;max-width:600px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
.pic{background-image:url(home-main.webp);background-repeat:no-repeat}
/* 上:タイトル絵(縦長の画面では少し大きく表示) */
.top{flex:none;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.top .pic{flex:none;width:100%}
/* 下:8つのボタン */
.grid{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px}
.tile{display:block;position:relative;border-radius:14px;background-image:url(home-main.webp);background-repeat:no-repeat;
  box-shadow:0 3px 6px rgba(0,0,0,.35);-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .08s,filter .08s}
a.tile:active{transform:translateY(3px) scale(.985);filter:brightness(.88)}
.tile.wide{grid-column:1/-1;background-size:100% 100%;aspect-ratio:2568/559;border-radius:12px}

.soon i{position:absolute;top:6%;right:4%;font-style:normal;font-size:11px;font-weight:900;color:#fff;background:rgba(40,30,20,.75);border-radius:99px;padding:2px 8px}
footer{flex:none;padding:2px 8px calc(6px + env(safe-area-inset-bottom));text-align:center;color:#fff;font-size:9.5px;line-height:1.5;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.tile.wide.soon i{left:2.5%;right:auto}
</style>
<script data-goatcounter="https://puratto-tokai.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<main class="app">
 <div class="top"><div class="pic" role="img" aria-label="ぷらっと東海 食べて・見て・楽しむ 東海のおでかけMAP" style="background-size:100.000% auto;background-position:0.000% 0.000%;aspect-ratio:1696/800"></div></div>
 <nav class="grid" aria-label="ぷらっと東海のメニュー">
  <a class="tile" href="new-pan.html" style="background-size:221.121% auto;background-position:6.674% 45.436%;aspect-ratio:767/382" aria-label="ぷらっとパンへ"></a>
  <a class="tile" href="ramen.html" style="background-size:221.121% auto;background-position:93.541% 45.436%;aspect-ratio:767/382" aria-label="ぷらっとラーメンへ"></a>
  <a class="tile" href="onsen.html" style="background-size:221.121% auto;background-position:6.674% 64.694%;aspect-ratio:767/350" aria-label="ぷらっと温泉へ"></a>
  <a class="tile" href="sapa-michi.html" style="background-size:221.121% auto;background-position:93.541% 64.694%;aspect-ratio:767/350" aria-label="ぷらっと道の駅SAPAへ"></a>
  <a class="tile" href="zekkei.html" style="background-size:221.121% auto;background-position:6.674% 81.178%;aspect-ratio:767/307" aria-label="ぷらっと絶景へ"></a>
  <a class="tile" href="fudosan.html" style="background-size:221.121% auto;background-position:93.541% 81.178%;aspect-ratio:767/307" aria-label="ぷらっと不動産へ"></a>
  <a class="tile" href="mirai.html" style="background-size:221.121% auto;background-position:6.674% 98.779%;aspect-ratio:767/345" aria-label="ぷらっと未来へ"></a>

  <span class="tile soon wide" style="background-image:url(tile-stoic.webp?v=6)" aria-label="ぷらっとストイック(準備中)"><i>準備中</i></span>

 </nav>
 <footer>

 </footer>
</main>
<script>
// 画面の高さに合わせて、タイトル絵を少し大きく(タイトル文字が切れない範囲まで)
function fitTop(){
  const app=document.querySelector('.app'),top=document.querySelector('.top'),pic=top.querySelector('.pic');
  const w=app.clientWidth,H=app.clientHeight,tw=(w-18)/2;
  const tiles=tw*(382+350+307+345)/767+(w-12)*559/2568*2+42, foot=document.querySelector('footer').offsetHeight;
  const avail=H-tiles-foot;
  const pw=Math.min(w*1.8,avail*1696/800);
  pic.style.width=pw+'px';top.style.height=(pw*800/1696)+'px';
}
addEventListener('resize',fitTop);fitTop();
// 「戻る」でホームに戻ったとき画面が青くなるのを防ぐ(読み込み直す)
addEventListener('pageshow',e=>{ if(e.persisted) location.reload(); });
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js?rev=20261117-home10').catch(err => console.warn('SW registration failed', err));
  });
}
</script>
</body>
</html>

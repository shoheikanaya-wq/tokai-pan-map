</main><script>

let shops = [];

async function loadBakeries(city) {
  const response = await fetch(
   'https://tokai-pan-api-873562719766.asia-northeast1.run.app',
    {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        textQuery: `パン屋 愛知県${city}`,
      })
    }
  );

  if (!response.ok) {
    throw new Error('Google Places API エラー: ' + response.status);
  }

  const data = await response.json();

  shops = (data.places || []).map(p => ({
    name: p.displayName?.text || '名称不明',
    rating: p.rating || 0,
    reviews: p.userRatingCount || 0,
    address: p.formattedAddress || '住所不明',
    type: 'パン屋',
    types: p.types || [],
    score: ((p.rating || 0) * 20) + Math.min(30, Math.log10((p.userRatingCount || 0) + 1) * 12)
  }));
shops = shops.filter(s => !/洋菓子|ケーキ|スイーツ|パティスリー|菓子店/.test(s.name));
  shops = shops.filter(s => s.types.includes('bakery'));
  shops = shops.filter(s => s.address.includes(city));
  shops.sort((a, b) =>
    b.score - a.score || b.reviews - a.reviews
  );
}
const home=document.querySelector('#home'),ranking=document.querySelector('#ranking'),detail=document.querySelector('#detail'),list=document.querySelector('#list');
function showRanking(){home.classList.add('hidden');detail.classList.add('hidden');ranking.classList.remove('hidden');list.innerHTML='';shops.slice(0,10).forEach((s,i)=>{let b=document.createElement('button');b.className='card rank';b.style.width='100%';b.innerHTML=`<span class="badge">${i+1}位</span><span class="grow"><strong>${s.name}</strong><br><span class="muted">${s.address}</span></span><span class="rating">★${s.rating}<br><small>口コミ ${s.reviews}件</small></span>`;b.onclick=()=>showDetail(i);list.appendChild(b)})}
function showDetail(i){let s=shops[i];ranking.classList.add('hidden');detail.classList.remove('hidden');drank.textContent=`豊田市 暫定${i+1}位 / Score ${s.score}`;dname.textContent=s.name;daddr.textContent=s.address;drating.textContent=`★ ${s.rating}`;dreviews.textContent=`口コミ ${s.reviews}件`;}
  async function selectCity(button, city) {
  try {
    rankingTitle.textContent = `${city} パン屋 TOP10`;
    button.disabled = true;
    button.textContent = '取得中…';

    await loadBakeries(city);
    showRanking();
  } catch(e) {
    alert('パン屋情報の取得に失敗しました：' + e.message);
  } finally {
    button.disabled = false;
    button.textContent = city;
  }
}

toyota.onclick = () => selectCity(toyota, '豊田市');
okazaki.onclick = () => selectCity(okazaki, '岡崎市');
anjo.onclick = () => selectCity(anjo, '安城市');
kariya.onclick = () => selectCity(kariya, '刈谷市');
  nishio.onclick = () => selectCity(nishio, '西尾市');
hekinan.onclick = () => selectCity(hekinan, '碧南市');
chiryu.onclick = () => selectCity(chiryu, '知立市');
takahama.onclick = () => selectCity(takahama, '高浜市');
miyoshi.onclick = () => selectCity(miyoshi, 'みよし市');
kota.onclick = () => selectCity(kota, '幸田町');
  toyohashi.onclick = () => selectCity(toyohashi, '豊橋市');
toyokawa.onclick = () => selectCity(toyokawa, '豊川市');
gamagori.onclick = () => selectCity(gamagori, '蒲郡市');
shinshiro.onclick = () => selectCity(shinshiro, '新城市');
tahara.onclick = () => selectCity(tahara, '田原市');
shitara.onclick = () => selectCity(shitara, '設楽町');
toei.onclick = () => selectCity(toei, '東栄町');
toyone.onclick = () => selectCity(toyone, '豊根村');
  nishimikawa.onclick = async () => {
  const cities = [
    '豊田市','岡崎市','安城市','刈谷市','西尾市',
    '碧南市','知立市','高浜市','みよし市','幸田町'
  ];

  const allShops = [];

  nishimikawa.disabled = true;
  nishimikawa.textContent = '取得中...';

  try {
    for (const city of cities) {
      await loadBakeries(city);
      allShops.push(...shops);
    }

    const unique = new Map();

    allShops.forEach(s => {
      const key = s.name + '|' + s.address;
      if (!unique.has(key)) unique.set(key, s);
    });

    shops = [...unique.values()];

    shops.sort((a, b) =>
      b.score - a.score || b.reviews - a.reviews
    );

    rankingTitle.textContent = '西三河 パン屋 TOP10';
    showRanking();

  } catch(e) {
    alert('西三河ランキングの取得に失敗しました：' + e.message);
  } finally {
    nishimikawa.disabled = false;
    nishimikawa.textContent = '🏆 西三河 TOP10';
  }
};
  higashimikawa.onclick = async () => {
  const cities = [
    '豊橋市', '豊川市', '蒲郡市', '新城市',
    '田原市', '設楽町', '東栄町', '豊根村'
  ];

  const allShops = [];

  higashimikawa.disabled = true;
  higashimikawa.textContent = '取得中...';

  try {
    for (const city of cities) {
      await loadBakeries(city);
      allShops.push(...shops);
    }

    const unique = new Map();

    allShops.forEach(s => {
      const key = s.name + '|' + s.address;
      if (!unique.has(key)) unique.set(key, s);
    });

    shops = [...unique.values()];

    shops.sort((a, b) =>
      b.score - a.score || b.reviews - a.reviews
    );

    rankingTitle.textContent = '東三河 パン屋 TOP10';
    showRanking();

  } catch(e) {
    alert('東三河ランキングの取得に失敗しました：' + e.message);

  } finally {
    higashimikawa.disabled = false;
    higashimikawa.textContent = '🏆 東三河 TOP10';
  }
};
  document.addEventListener('click', (e) => {
  const btn = e.target.closest('button');

  if (!btn) return;

  const isSelectable =
    btn.matches('.tabs button') ||
    btn.matches('.cities button') ||
    btn.id === 'nishimikawa' ||
    btn.id === 'higashimikawa' ||
    btn.id === 'mikawa';

  if (!isSelectable) return;

  document.querySelectorAll(
    '.tabs button, .cities button, #nishimikawa, #higashimikawa, #mikawa'
  ).forEach(b => b.classList.remove('active'));

  btn.classList.add('active');
});
back.onclick=()=>{ranking.classList.add('hidden');home.classList.remove('hidden')};back2.onclick=showRanking;
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script></body></html>

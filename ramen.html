<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8b2f22">
<title>ぷらっとラーメン｜東海のラーメン店探索</title>
<style>
*{box-sizing:border-box}
:root{font-family:system-ui,-apple-system,sans-serif;color:#2f211c;background:#fff8ee}
body{margin:0;background:#f5eee3;color:#3b2c25}
header{position:sticky;top:0;z-index:5;background:#fff8eef2;backdrop-filter:blur(8px);border-bottom:1px solid #ead8c4;padding:14px 16px}
header h1{margin:0;font-size:21px}
.sub{font-size:12px;color:#75645a;margin-top:3px}
nav{margin-top:7px;font-size:12px}
nav a{color:#783528;font-weight:800;text-decoration:none}
main{max-width:720px;margin:auto;padding:14px}
.hero{background:linear-gradient(135deg,#fff1d8,#f5d3bd);border:1px solid #e7c9ad;border-radius:18px;padding:16px;margin-bottom:12px}
.hero strong{display:block;font-size:17px;margin-bottom:4px}
.search{display:grid;grid-template-columns:1fr auto;gap:8px;margin:12px 0}
input,button{font:inherit}
input{min-width:0;border:1px solid #c99e7e;border-radius:13px;background:#fff;padding:13px}
button{border:0;border-radius:13px;background:#8b2f22;color:#fff;font-weight:800;padding:12px 16px;cursor:pointer}
button:disabled{opacity:.55}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 14px}
.chips button{background:#fff7ed;color:#633326;border:1px solid #d9b69b;padding:8px 11px}
.area-picker{margin:14px 0;padding:13px;background:#fffaf3;border:1px solid #ead9c7;border-radius:16px}
.area-picker h2{font-size:16px;margin:0 0 9px}
.pref-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.pref-tabs button{background:#fff7ed;color:#633326;border:1px solid #d9b69b;padding:9px}
.pref-tabs button.active{background:#8b2f22;color:#fff;border-color:#8b2f22}
.select-row{display:grid;grid-template-columns:1fr 1fr;gap:7px}
select{width:100%;min-width:0;min-height:44px;border:1px solid #c99e7e;border-radius:12px;background:#fff;padding:9px;font:inherit;color:#3b2c25}
@media(max-width:430px){.select-row{grid-template-columns:1fr}}
.note{font-size:12px;color:#78685e;line-height:1.5}
.card{background:#fffaf3;border:1px solid #ead9c7;border-radius:16px;padding:13px;margin:9px 0}
.rank{display:flex;gap:10px;align-items:flex-start}
.badge{min-width:34px;font-weight:900;color:#8b2f22}
.grow{min-width:0;flex:1}
.name{font-weight:900;font-size:16px}.name-btn{all:unset;display:block;font-weight:900;font-size:16px;cursor:pointer;color:#3b2c25}.name-btn:focus-visible{outline:3px solid #8b2f22;outline-offset:3px;border-radius:4px}
.detail-photo{width:100%;max-height:310px;object-fit:cover;border-radius:16px;background:#eadfce;margin:8px 0 12px}
.detail-title{font-size:22px;margin:8px 0}.detail-grid{display:grid;gap:8px}.detail-row{background:#fffaf3;border:1px solid #ead9c7;border-radius:13px;padding:11px;font-size:13px;line-height:1.55}.hours{white-space:pre-line}.detail-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}.detail-actions a,.detail-actions button{display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:12px;text-decoration:none;font-weight:800}.detail-actions a{background:#f0ddca;color:#543326}.review{border-top:1px solid #ead9c7;padding:10px 0}.review:first-child{border-top:0}.review-meta{font-size:12px;font-weight:800}.review-text{font-size:13px;line-height:1.5;margin-top:4px}
.meta{font-size:12px;color:#75665d;margin-top:4px;line-height:1.45}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.tag{display:inline-flex;padding:4px 7px;border-radius:999px;background:#f7e2c9;color:#6b3929;font-size:11px;font-weight:800}.filters{display:flex;gap:6px;overflow-x:auto;padding:3px 0 10px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filters button{white-space:nowrap;background:#fff7ed;color:#633326;border:1px solid #d9b69b;padding:8px 11px}.filters button.active{background:#8b2f22;color:#fff;border-color:#8b2f22}
.rush-panel{position:sticky;bottom:10px;z-index:4;background:#3d2119f2;color:#fff;border-radius:16px;padding:11px 12px;margin:12px 0;box-shadow:0 8px 28px #0003}.rush-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.rush-head strong{font-size:14px}.rush-count{font-size:12px}.rush-list{font-size:12px;line-height:1.5;margin-top:7px}.rush-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.rush-actions button,.rush-actions a{flex:1;min-height:42px;display:flex;align-items:center;justify-content:center;border-radius:11px;font-weight:800;text-decoration:none}.rush-actions button{background:#fff0db;color:#572b20}.rush-actions a{background:#d96736;color:#fff}.rush-add{margin-top:8px;background:#fff7ed!important;color:#633326!important;border:1px solid #d9b69b!important;padding:7px 9px!important}.rush-add.selected{background:#8b2f22!important;color:#fff!important;border-color:#8b2f22!important}
.actions a{display:inline-flex;padding:8px 10px;border-radius:10px;background:#f0ddca;color:#543326;text-decoration:none;font-size:12px;font-weight:800}
.loading,.error{background:#fffaf3;border:1px solid #ead9c7;border-radius:15px;padding:18px;text-align:center;margin-top:12px}
.error{color:#7c2d22}
.hidden{display:none}
footer{text-align:center;padding:26px 10px 40px;font-size:11px;color:#85746a}
@media(max-width:480px){.search{grid-template-columns:1fr}.search button{min-height:46px}.name{font-size:15px}}
</style>
</head>
<body>
<header>
  <h1>🍜 ぷらっとラーメン</h1>
  <div class="sub">東海3県のラーメン店を、ぷらっと探す</div>
  <nav><a href="index.html">ぷらっと東海</a> › <strong>ぷらっとラーメン</strong></nav>
</header>
<main>
  <section id="home">
    <div class="hero"><strong>🍜 まずは街の名前から。</strong><span class="note">愛知・岐阜・三重の市町村を入力すると、評価と口コミ数を加味して最大10店を表示します。</span></div>
    <div class="area-picker">
      <h2>📍 エリアから探す</h2>
      <div class="pref-tabs">
        <button type="button" class="active" data-pref="愛知県">愛知県</button>
        <button type="button" data-pref="岐阜県">岐阜県</button>
        <button type="button" data-pref="三重県">三重県</button>
      </div>
      <div class="select-row">
        <select id="regionSelect" aria-label="地域"></select>
        <select id="citySelect" aria-label="市町村"></select>
      </div>
    </div>
    <div class="search">
      <input id="areaInput" inputmode="search" autocomplete="address-level2" placeholder="市町村名を直接入力しても検索できます" aria-label="市町村名">
      <button id="searchBtn" type="button">ラーメンを探す</button>
    </div>
    <div class="chips" aria-label="すぐ探す">
      <button type="button" data-area="豊田市">豊田市</button>
      <button type="button" data-area="名古屋市">名古屋市</button>
      <button type="button" data-area="岡崎市">岡崎市</button>
      <button type="button" data-area="岐阜市">岐阜市</button>
      <button type="button" data-area="四日市市">四日市市</button>
    </div>
    <div class="note">県→地域→市町村から選ぶか、市町村名を直接入力できます。次段階で店舗詳細とラーメンラッシュへ拡張します。</div>
  </section>
  <section id="results" class="hidden">
    <button id="backBtn" type="button">← 検索へ戻る</button>
    <h2 id="resultTitle"></h2>
    <div id="filterBar" class="filters" aria-label="ラーメンの系統で絞り込み"></div>
    <div id="filterNote" class="note"></div>
    <div id="list"></div>
    <div id="rushPanel" class="rush-panel hidden">
      <div class="rush-head"><strong>🍜 ラーメンラッシュ</strong><span id="rushCount" class="rush-count">0/5店</span></div>
      <div id="rushList" class="rush-list"></div>
      <div class="rush-actions">
        <button id="rushOptimize" type="button">✨ おすすめ順</button>
        <button id="rushClear" type="button">選択解除</button>
        <a id="rushRoute" class="hidden" target="_blank" rel="noopener">巡回ルートを開く</a>
      </div>
    </div>
  </section>
  <section id="detail" class="hidden">
    <button id="detailBack" type="button">← TOP10へ戻る</button>
    <img id="detailPhoto" class="detail-photo hidden" alt="">
    <h2 id="detailName" class="detail-title"></h2>
    <div id="detailRating" class="meta"></div>
    <div class="detail-grid">
      <div id="detailAddress" class="detail-row"></div>
      <div id="detailHours" class="detail-row hours"></div>
      <div id="detailPhone" class="detail-row"></div>
    </div>
    <div class="detail-actions">
      <a id="detailMaps" target="_blank" rel="noopener">📍 地図を開く</a>
      <a id="detailWeb" target="_blank" rel="noopener">🌐 Web</a>
      <button id="reviewBtn" type="button">💬 口コミを見る</button>
    </div>
    <div id="reviewBox" class="card hidden"></div>
  </section>
</main>
<footer>ぷらっと東海 / ぷらっとラーメン MVP</footer>
<script>
const API='https://tokai-pan-route-api-873562719766.asia-northeast1.run.app';
const input=document.getElementById('areaInput');
const searchBtn=document.getElementById('searchBtn');
const home=document.getElementById('home');
const results=document.getElementById('results');
const list=document.getElementById('list');
const title=document.getElementById('resultTitle');
const detail=document.getElementById('detail');
let currentShops=[];
let activeTag='すべて';
let rushSelected=[];
const regionSelect=document.getElementById('regionSelect');
const citySelect=document.getElementById('citySelect');
let currentPref='愛知県';
const AREAS={
 '愛知県':{
  '西三河':['豊田市','岡崎市','安城市','刈谷市','西尾市','碧南市','知立市','高浜市','みよし市','幸田町'],
  '東三河':['豊橋市','豊川市','蒲郡市','新城市','田原市'],
  '名古屋':['名古屋市'],
  '尾張':['一宮市','瀬戸市','春日井市','犬山市','江南市','小牧市','稲沢市','尾張旭市','岩倉市','豊明市','日進市','長久手市'],
  '知多':['半田市','常滑市','東海市','大府市','知多市']
 },
 '岐阜県':{
  '岐阜・西濃':['岐阜市','大垣市','各務原市','羽島市','瑞穂市','本巣市'],
  '中濃':['関市','美濃市','美濃加茂市','可児市','郡上市'],
  '東濃':['多治見市','土岐市','瑞浪市','恵那市','中津川市'],
  '飛騨':['高山市','飛騨市','下呂市']
 },
 '三重県':{
  '北勢':['四日市市','桑名市','鈴鹿市','亀山市','いなべ市'],
  '中勢':['津市','松阪市'],
  '伊賀':['伊賀市','名張市'],
  '伊勢志摩':['伊勢市','鳥羽市','志摩市'],
  '東紀州':['尾鷲市','熊野市']
 }
};
function refreshRegions(){
 const regions=Object.keys(AREAS[currentPref]||{});
 regionSelect.innerHTML=regions.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');
 refreshCities();
}
function refreshCities(){
 const cities=AREAS[currentPref]?.[regionSelect.value]||[];
 citySelect.innerHTML='<option value="">市町村を選択</option>'+cities.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');
}
document.querySelectorAll('[data-pref]').forEach(b=>b.addEventListener('click',()=>{
 currentPref=b.dataset.pref;
 document.querySelectorAll('[data-pref]').forEach(x=>x.classList.toggle('active',x===b));
 refreshRegions();
}));
regionSelect.addEventListener('change',refreshCities);
citySelect.addEventListener('change',()=>{if(citySelect.value)runSearch(citySelect.value,currentPref);});
refreshRegions();

function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function score(p){
  const r=Number(p.rating)||0,v=Math.max(0,Number(p.userRatingCount)||0);
  const prior=4.0,w=40;
  return ((v/(v+w))*r+(w/(v+w))*prior)*20+Math.min(22,Math.log10(v+1)*8);
}
function validRamen(p){
  const n=String(p.displayName?.text||'');
  const types=Array.isArray(p.types)?p.types:[];
  if(/コンビニ|スーパー|ホテル|居酒屋/.test(n)) return false;
  return types.includes('ramen_restaurant') || /ラーメン|らーめん|拉麺|中華そば|麺屋|麺処|麺場|担々麺|つけ麺/.test(n);
}
const RAMEN_TAGS=['すべて','醤油','味噌','塩','豚骨','家系','二郎系','担々麺','つけ麺','中華そば'];
function ramenTags(p){
 const name=String(p.displayName?.text||'');
 const tags=[];
 const rules=[
  ['醤油',/醤油|しょうゆ|正油/],['味噌',/味噌|みそ/],['塩',/(^|[^美])塩|しおラーメン/],
  ['豚骨',/豚骨|とんこつ/],['家系',/家系|横浜家系/],['二郎系',/二郎|二郎系|ラーメン荘/],
  ['担々麺',/担々麺|担担麺|坦々麺/],['つけ麺',/つけ麺|つけめん/],['中華そば',/中華そば/]
 ];
 rules.forEach(([tag,re])=>{if(re.test(name))tags.push(tag)});
 return [...new Set(tags)];
}
function renderFilters(){
 const available=new Set(currentShops.flatMap(ramenTags));
 const shown=RAMEN_TAGS.filter(t=>t==='すべて'||available.has(t));
 if(!shown.includes(activeTag))activeTag='すべて';
 const bar=document.getElementById('filterBar');
 bar.innerHTML=shown.map(t=>'<button type="button" class="'+(t===activeTag?'active':'')+'" data-filter="'+esc(t)+'">'+esc(t)+'</button>').join('');
 bar.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{activeTag=b.dataset.filter;renderShopList();renderFilters()}));
 document.getElementById('filterNote').textContent=available.size?'店名から確認できる系統だけを表示しています。推測だけで分類はしません。':'系統を断定できる店名がないため、分類なしで表示しています。';
}
function renderShopList(){
 const visible=activeTag==='すべて'?currentShops:currentShops.filter(p=>ramenTags(p).includes(activeTag));
 if(!visible.length){list.innerHTML='<div class="error">この系統に該当する店舗はありません。</div>';return}
 list.innerHTML=visible.map((p)=>{
   const i=currentShops.indexOf(p),name=p.displayName?.text||'名称不明',rating=Number(p.rating)||0,reviews=Number(p.userRatingCount)||0;
   const maps=p.googleMapsUri||('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(name+' '+(p.formattedAddress||'')));
   const web=p.websiteUri||'',tags=ramenTags(p);
   return '<article class="card"><div class="rank"><div class="badge">'+(i+1)+'位</div><div class="grow"><button class="name-btn" type="button" data-detail="'+i+'">'+esc(name)+'</button><div class="meta">★ '+(rating?rating.toFixed(1):'―')+'　口コミ '+reviews.toLocaleString()+'件<br>'+esc(p.formattedAddress||'住所情報なし')+'</div>'+(tags.length?'<div class="tags">'+tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>':'')+'<button type="button" class="rush-add '+(rushSelected.includes(i)?'selected':'')+'" data-rush="'+i+'">'+(rushSelected.includes(i)?'✓ ラッシュ選択中':'＋ ラッシュに追加')+'</button><div class="actions"><a target="_blank" rel="noopener" href="'+esc(maps)+'">📍 地図</a>'+(web?'<a target="_blank" rel="noopener" href="'+esc(web)+'">🌐 Web</a>':'')+'</div></div></div></article>';
 }).join('');
 list.querySelectorAll('[data-detail]').forEach(b=>b.addEventListener('click',()=>showDetail(Number(b.dataset.detail))));
 list.querySelectorAll('[data-rush]').forEach(b=>b.addEventListener('click',()=>toggleRush(Number(b.dataset.rush))));
}
async function runSearch(area,pref=''){
  area=String(area||'').trim();
  if(!area)return;
  input.value=area;
  searchBtn.disabled=true;
  home.classList.add('hidden');results.classList.remove('hidden');
  title.textContent=area+' ラーメン TOP10';
  list.innerHTML='<div class="loading">ラーメン店を探しています…</div>';
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({category:'ramen',area:(pref||'')+area})});
    if(!r.ok)throw new Error('API '+r.status);
    const data=await r.json();
    const shops=(data.places||[]).filter(validRamen).filter(p=>String(p.formattedAddress||'').includes(area.replace(/[市区町村]$/,''))).sort((a,b)=>score(b)-score(a)).slice(0,10);
    currentShops=shops;
    activeTag='すべて';
    rushSelected=[];
    updateRush();
    if(!shops.length){list.innerHTML='<div class="error">該当するラーメン店を確認できませんでした。別の市町村名でも試してください。</div>';document.getElementById('filterBar').innerHTML='';document.getElementById('filterNote').textContent='';return;}
    renderFilters();
    renderShopList();
  }catch(e){
    console.error(e);
    list.innerHTML='<div class="error"><strong>店舗情報を取得できませんでした。</strong><br>少し時間を置いて再試行してください。</div>';
  }finally{searchBtn.disabled=false;}
}


function toggleRush(i){
 const pos=rushSelected.indexOf(i);
 if(pos>=0)rushSelected.splice(pos,1);
 else{
  if(rushSelected.length>=5){alert('ラーメンラッシュは最大5店です。');return}
  rushSelected.push(i);
 }
 updateRush();
 renderShopList();
}
function rushMapsUrl(){
 const selected=rushSelected.map(i=>currentShops[i]).filter(Boolean);
 if(selected.length<2)return '';
 const q=p=>encodeURIComponent((p.displayName?.text||'ラーメン店')+' '+(p.formattedAddress||''));
 const origin=q(selected[0]),destination=q(selected[selected.length-1]);
 const waypoints=selected.slice(1,-1).map(q).join('%7C');
 return 'https://www.google.com/maps/dir/?api=1&origin='+origin+'&destination='+destination+(waypoints?'&waypoints='+waypoints:'')+'&travelmode=driving';
}
function updateRush(){
 const panel=document.getElementById('rushPanel'),count=document.getElementById('rushCount'),names=document.getElementById('rushList'),route=document.getElementById('rushRoute');
 const selected=rushSelected.map(i=>currentShops[i]).filter(Boolean);
 if(!selected.length){panel.classList.add('hidden');return}
 panel.classList.remove('hidden');count.textContent=selected.length+'/5店';
 names.innerHTML=selected.map((p,n)=>(n+1)+'. '+esc(p.displayName?.text||'名称不明')).join('<br>');
 const url=rushMapsUrl();
 if(url){route.href=url;route.classList.remove('hidden');route.textContent='🚗 '+selected.length+'店を巡る'}else{route.classList.add('hidden')}
}

async function optimizeRush(){
 const btn=document.getElementById('rushOptimize');
 const selected=rushSelected.map(i=>({i,p:currentShops[i]})).filter(x=>x.p?.location);
 if(selected.length<3){alert('おすすめ順は3店以上で使えます。');return}
 btn.disabled=true;btn.textContent='計算中…';
 try{
  const point=x=>({lat:Number(x.p.location.latitude),lng:Number(x.p.location.longitude)});
  const origin=point(selected[0]),destination=point(selected[selected.length-1]),middle=selected.slice(1,-1);
  const r=await fetch(API+'/route',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({origin,destination,intermediates:middle.map(point),vehicle:'car',optimize:true})});
  if(!r.ok)throw new Error('route '+r.status);
  const data=await r.json(),order=data.optimizedIntermediateWaypointIndex||[];
  if(order.length===middle.length){
   rushSelected=[selected[0].i,...order.map(n=>middle[n]?.i).filter(Number.isInteger),selected[selected.length-1].i];
  }
  updateRush();renderShopList();
  const km=(Number(data.distanceMeters)||0)/1000,min=Math.round((Number(data.durationSeconds)||0)/60);
  document.getElementById('rushList').insertAdjacentHTML('beforeend','<br><strong>おすすめ順：約 '+km.toFixed(1)+'km / '+min+'分</strong>');
 }catch(e){console.error(e);alert('おすすめ順を計算できませんでした。選択順のままルートを開けます。')}
 finally{btn.disabled=false;btn.textContent='✨ おすすめ順'}
}
document.getElementById('rushOptimize').addEventListener('click',optimizeRush);

document.getElementById('rushClear').addEventListener('click',()=>{rushSelected=[];updateRush();renderShopList()});

function photoUrl(p){
 const n=p?.photos?.[0]?.name;
 return n?API+'?photoName='+encodeURIComponent(n)+'&maxWidthPx=900':'';
}
function showDetail(i){
 const p=currentShops[i]; if(!p)return;
 results.classList.add('hidden');home.classList.add('hidden');detail.classList.remove('hidden');
 const name=p.displayName?.text||'名称不明',rating=Number(p.rating)||0,reviews=Number(p.userRatingCount)||0;
 document.getElementById('detailName').textContent=name;
 document.getElementById('detailRating').innerHTML='★ '+(rating?rating.toFixed(1):'―')+'　口コミ '+reviews.toLocaleString()+'件'+(ramenTags(p).length?'<div class="tags">'+ramenTags(p).map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>':'');
 document.getElementById('detailAddress').textContent='📍 '+(p.formattedAddress||'住所情報なし');
 const hours=p.regularOpeningHours?.weekdayDescriptions||[];
 document.getElementById('detailHours').textContent=hours.length?'🕒 営業時間\n'+hours.join('\n'):'🕒 営業時間：情報なし';
 document.getElementById('detailPhone').textContent='☎ '+(p.nationalPhoneNumber||'電話番号：情報なし');
 const maps=p.googleMapsUri||('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(name+' '+(p.formattedAddress||'')));
 const ma=document.getElementById('detailMaps');ma.href=maps;
 const wa=document.getElementById('detailWeb');
 if(p.websiteUri){wa.href=p.websiteUri;wa.classList.remove('hidden')}else{wa.classList.add('hidden')}
 const img=document.getElementById('detailPhoto'),src=photoUrl(p);
 if(src){img.src=src;img.alt=name+'の店舗写真';img.classList.remove('hidden')}else{img.removeAttribute('src');img.classList.add('hidden')}
 const box=document.getElementById('reviewBox');box.classList.add('hidden');box.innerHTML='';
 document.getElementById('reviewBtn').onclick=()=>loadReviews(p);
}
async function loadReviews(p){
 const box=document.getElementById('reviewBox');box.classList.remove('hidden');box.innerHTML='<div class="loading">口コミを読み込んでいます…</div>';
 try{
  if(!p.id)throw new Error('place idなし');
  const r=await fetch(API+'?placeId='+encodeURIComponent(p.id)+'&reviews=1');
  if(!r.ok)throw new Error('口コミAPI '+r.status);
  const data=await r.json(),reviews=Array.isArray(data.reviews)?data.reviews:[];
  if(!reviews.length){box.innerHTML='<div class="note">表示できる口コミがありません。</div>';return}
  box.innerHTML='<strong>💬 口コミ</strong>'+reviews.slice(0,5).map(v=>{
   const author=v.authorAttribution?.displayName||'Googleユーザー';
   const rating=Number(v.rating)||0;
   const text=v.text?.text||v.originalText?.text||'';
   return '<div class="review"><div class="review-meta">'+esc(author)+'　★ '+(rating||'―')+'</div><div class="review-text">'+esc(text)+'</div></div>';
  }).join('');
 }catch(e){console.error(e);box.innerHTML='<div class="error">口コミを取得できませんでした。</div>'}
}
document.getElementById('detailBack').addEventListener('click',()=>{detail.classList.add('hidden');results.classList.remove('hidden')});

searchBtn.addEventListener('click',()=>runSearch(input.value,''));
input.addEventListener('keydown',e=>{if(e.key==='Enter')runSearch(input.value,'');});
document.querySelectorAll('[data-area]').forEach(b=>b.addEventListener('click',()=>runSearch(b.dataset.area,'')));
document.getElementById('backBtn').addEventListener('click',()=>{results.classList.add('hidden');detail.classList.add('hidden');home.classList.remove('hidden');});
</script>
</body>

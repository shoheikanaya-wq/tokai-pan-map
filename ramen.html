<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7a4b20"><title>ぷらっとラーメン</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3efe6;color:#2b2118;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
:root{--gh:clamp(108px,34vw,150px);--cw:calc(var(--gh)*.89 + 12px)}
/* 茶色の帯の右側に明るい台をつくり、そこに3キャラを立たせる */
header{position:relative;overflow:hidden;background:#7a4b20;color:#fff;padding:12px calc(var(--cw) + 18px) 12px 14px;min-height:calc(var(--gh) + 12px)}
header::after{content:"";position:absolute;right:0;top:0;bottom:0;width:calc(var(--cw) + 14px);background:#f3efe6;border-radius:56px 0 0 0}
header .chars{position:absolute;right:4px;bottom:0;padding:0;gap:4px;z-index:1}
header h1{margin:0;font-size:clamp(17px,5.4vw,22px)}
header .sub{font-size:clamp(12px,3.6vw,14px);margin-top:2px;opacity:.95}
header a{display:inline-block;margin-top:8px;padding:8px 14px;border-radius:999px;background:#fff;color:#6b431f;text-decoration:none;font-weight:800;font-size:clamp(12px,3.6vw,14px);white-space:nowrap}
main{max-width:760px;margin:0 auto;padding:10px 12px 28px}
.chars{display:flex;justify-content:center;align-items:flex-end;gap:10px;padding:8px 0}
.chars img{height:var(--gh);width:auto;object-fit:contain;transform-origin:50% 100%}
/* キャラの動き(ゆれる・首をかしげる・ぴょんと跳ねる) */
.chars img.girl{animation:sway 3.2s ease-in-out infinite}
.chars img.cat{height:calc(var(--gh)*.3);animation:tilt 2.6s ease-in-out infinite}
.chars img.dog{height:calc(var(--gh)*.46);animation:hop 1.8s ease-in-out infinite}
.chars.pop img.girl{animation:pop .5s ease-out both,sway 3.2s .5s ease-in-out infinite}
.chars.pop img.cat{animation:pop .5s .12s ease-out both,tilt 2.6s .7s ease-in-out infinite}
.chars.pop img.dog{animation:pop .5s .24s ease-out both,hop 1.8s .8s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(1.5deg)}}
@keyframes tilt{0%,60%,100%{transform:rotate(0)}75%{transform:rotate(-6deg)}88%{transform:rotate(3deg)}}
@keyframes hop{0%,55%,100%{transform:translateY(0) scaleY(1)}65%{transform:translateY(0) scaleY(.92)}78%{transform:translateY(-14%) scaleY(1.04)}90%{transform:translateY(0) scaleY(.96)}}
@keyframes pop{0%{transform:translateY(25%) scale(.7);opacity:0}70%{transform:translateY(-6%) scale(1.04);opacity:1}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.chars img{animation:none!important}}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:10px 0 4px;padding:4px;border-radius:16px;background:#5a3714}
.tabs button{min-height:50px;border-radius:12px;border:0;background:transparent;color:#f3e3c8;font-weight:900;font-size:18px;letter-spacing:.05em}
.tabs button.on{background:#fff;color:#5a3714;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.label{margin:12px 2px 6px;font-size:14px;font-weight:900;color:#7a5a3a;display:flex;align-items:center;gap:8px}
.label::after{content:"";flex:1;height:2px;background:#e2d6bd;border-radius:2px}
.cities{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cities button{min-height:46px;border-radius:12px;border:2px solid #e2d6bd;background:#fff;color:#3b2511;font-weight:800;font-size:15px;padding:4px}
.cities button.on{border-color:#b5481f;background:#fff0e6}
#panel{margin-top:14px;background:#fff;border-radius:16px;border:2px solid #e2d6bd;padding:12px}
#panel h2{margin:0 0 6px;font-size:20px;color:#3b2511}
.empty{padding:14px 6px;text-align:center;font-size:17px;font-weight:800;color:#6b5a48;line-height:1.6}
.rank{display:flex;gap:10px;padding:12px 0;border-top:1px solid #eee3cc}
.rank:first-of-type{border-top:0}
.num{flex:none;width:36px;height:36px;border-radius:50%;background:#b5481f;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:17px}
.rank h3{margin:0;font-size:18px;color:#3b2511}
.rank p{margin:3px 0;font-size:14px;line-height:1.5}
.rank .btns a{display:inline-block;margin:4px 6px 0 0;padding:8px 12px;border-radius:10px;background:#7a4b20;color:#fff;text-decoration:none;font-weight:800;font-size:14px}
.rank .btns a.sub{background:#fff;color:#7a4b20;border:2px solid #7a4b20}
.warn{font-size:12px;font-weight:800;color:#8a4b00;background:#fff0c9;border:1px solid #e0a31f;border-radius:8px;padding:1px 6px;margin-left:6px}
.note{font-size:12px;color:#8a7c6b;margin-top:10px;line-height:1.5}
</style></head>
<body>
<header><h1>🍜 ぷらっとラーメン</h1><div class="sub">市町村から、ラーメン店を探す</div><a href="index.html">← ぷらっと東海へ戻る</a><div class="chars" id="chars" aria-hidden="true"></div></header>
<main>
 <div class="tabs" id="tabs"></div>
 <div class="label">市町村をえらぶ</div>
 <div class="cities" id="cities"></div>
 <section id="panel" hidden></section>
</main>
<script>
(function(){
'use strict';
// 3キャラ(女子高生・猫・犬)。女子高生は基本1番(ramen-girl.webp)。市町村を開くと、髪型ちがい(2〜7番)が市町村ごとに出る。
// 画像が読めないときは、パンのキャラを代わりに出す。
var CHARS=[
 ['girl','assets/mini-mascots/girl-camera-02.webp'],
 ['cat','assets/mini-mascots/cat-sit-01.webp'],
 ['dog','assets/mini-mascots/shiba-walk-01.webp']
];
function girlNo(id){var h=0;for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))%997;return 2+h%6}
var PREF={aichi:'愛知県',gifu:'岐阜県',mie:'三重県'};
var CITIES={"aichi":[["toyota","豊田市"],["okazaki","岡崎市"],["anjo","安城市"],["kariya","刈谷市"],["nishio","西尾市"],["hekinan","碧南市"],["chiryu","知立市"],["takahama","高浜市"],["miyoshi","みよし市"],["kota","幸田町"],["toyohashi","豊橋市"],["toyokawa","豊川市"],["gamagori","蒲郡市"],["shinshiro","新城市"],["tahara","田原市"],["shitara","設楽町"],["toei","東栄町"],["toyone","豊根村"],["nagoya","名古屋市"],["ichinomiya","一宮市"],["seto","瀬戸市"],["kasugai","春日井市"],["inuyama","犬山市"],["konan","江南市"],["komaki","小牧市"],["inazawa","稲沢市"],["owariasahi","尾張旭市"],["iwakura","岩倉市"],["toyoake","豊明市"],["nisshin","日進市"],["kiyosu","清須市"],["kitanagoya","北名古屋市"],["nagakute","長久手市"],["togo","東郷町"],["toyoyama","豊山町"],["oguchi","大口町"],["fuso","扶桑町"],["ama","あま市"],["kanie","蟹江町"],["tsushima","津島市"],["aisai","愛西市"],["yatomi","弥富市"],["handa","半田市"],["tokoname","常滑市"],["tokai","東海市"],["obu","大府市"],["chita","知多市"],["agui","阿久比町"],["higashiura","東浦町"],["mihama","美浜町"],["taketoyo","武豊町"]],"gifu":[["ogaki","大垣市"],["kakamigahara","各務原市"],["hashima","羽島市"],["mizuho","瑞穂市"],["ginan","岐南町"],["yoro","養老町"],["tarui","垂井町"],["sekigahara","関ケ原町"],["godo","神戸町"],["wanouchi","輪之内町"],["anpachi","安八町"],["ibigawa","揖斐川町"],["kitagata","北方町"],["tajimi","多治見市"],["kani","可児市"],["seki","関市"],["mino","美濃市"],["gujo","郡上市"],["minokamo","美濃加茂市"],["toki","土岐市"],["mizunami","瑞浪市"],["ena","恵那市"],["nakatsugawa","中津川市"],["sakahogi","坂祝町"],["tomika","富加町"],["kawabe","川辺町"],["yaotsu","八百津町"],["higashishirakawa","東白川村"],["mitake","御嵩町"],["yamagata","山県市"],["motosu","本巣市"],["kaizu","海津市"],["gero","下呂市"],["takayama","高山市"],["hida","飛騨市"]],"mie":[["yokkaichi","四日市市"],["kuwana","桑名市"],["suzuka","鈴鹿市"],["inabe","いなべ市"],["toin","東員町"],["komono","菰野町"],["kawagoe","川越町"],["tsu","津市"],["matsusaka","松阪市"],["kameyama","亀山市"],["iga","伊賀市"],["nabari","名張市"],["taki","多気町"],["meiwa","明和町"],["odai","大台町"],["ise","伊勢市"],["toba","鳥羽市"],["shima","志摩市"],["owase","尾鷲市"],["kumano","熊野市"],["tamaki","玉城町"],["watarai","度会町"],["taiki","大紀町"],["minamiise","南伊勢町"],["kihoku","紀北町"],["kiho","紀宝町"]]};
var pref='aichi',cityId='';
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function safeUrl(u){return /^https?:\/\//.test(u||'')?u:''}
function charsHtml(n){return CHARS.map(function(c){var f=c[0]==='girl'?(n>1?'ramen-girl-'+n:'ramen-girl'):'ramen-'+c[0];return '<img class="'+c[0]+'" src="assets/ramen-mascots/'+f+'.webp" alt="" onerror="this.onerror=null;this.src=\''+c[1]+'\'">'}).join('')}
$('chars').innerHTML=charsHtml(1);
function drawTabs(){
 $('tabs').innerHTML=Object.keys(PREF).map(function(k){return '<button type="button" data-p="'+k+'"'+(k===pref?' class="on"':'')+'>'+PREF[k]+'</button>'}).join('');
 $('cities').innerHTML=CITIES[pref].map(function(c){return '<button type="button" data-c="'+c[0]+'"'+(c[0]===cityId?' class="on"':'')+'>'+esc(c[1])+'</button>'}).join('');
}
function cityName(){var r=CITIES[pref].filter(function(c){return c[0]===cityId})[0];return r?r[1]:''}
function mapUrl(s){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent((s.name||'')+' '+(s.address||''))}
function shopHtml(s,i){
 var w=safeUrl(s.website);
 return '<div class="rank"><div class="num">'+(i+1)+'</div><div><h3>'+esc(s.name)+(s.verify?'<span class="warn">要確認</span>':'')+'</h3>'+
  (s.catchphrase?'<p>'+esc(s.catchphrase)+'</p>':'')+
  ((s.openingHours||[]).length?'<p>🕒 '+s.openingHours.map(esc).join('<br>')+'</p>':'')+
  (s.address?'<p>📍 '+esc(s.address)+'</p>':'')+
  '<div class="btns"><a href="'+mapUrl(s)+'" target="_blank" rel="noopener">🗺 地図</a>'+(w?'<a class="sub" href="'+esc(w)+'" target="_blank" rel="noopener">公式・詳細</a>':'')+'</div></div></div>';
}
function show(){
 var p=$('panel');
 if(!cityId){p.hidden=true;return}
 p.hidden=false;
 var id=cityId,pf=pref;
 p.innerHTML='<h2>'+esc(cityName())+' ラーメン <span id="topn">TOP10</span></h2><div class="chars pop" aria-hidden="true">'+charsHtml(girlNo(id))+'</div><div class="empty">読み込み中…</div>';
 fetch('data/ramen/'+pf+'-'+id+'.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json()}).catch(function(){return null}).then(function(d){
  if(id!==cityId||pf!==pref)return;
  var shops=d&&d.shops||[];
  var top=shops.slice(0,20);var tn=p.querySelector('#topn');if(tn&&top.length)tn.textContent='TOP'+(top.length>10?top.length:10);
  var body=shops.length?top.map(shopHtml).join('')+(d.attribution?'<div class="note">'+esc(d.attribution)+'</div>':''):'<div class="empty">🍜 準備中です<br>もうすぐ追加されます</div>';
  var w=p.querySelector('.empty');if(w)w.outerHTML=body;
 });
}
$('tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;pref=b.dataset.p;cityId='';drawTabs();show()});
$('cities').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;cityId=b.dataset.c;drawTabs();show();$('panel').scrollIntoView({behavior:'smooth',block:'start'})});
drawTabs();
})();
</script>
</body></html>

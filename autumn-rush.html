<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b22f2a"><title>秋のパンラッシュ｜東海パンMAP</title><style>:root{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;color:#352820;background:#fff8ec}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fffdf6,#fff4de)}header{position:sticky;top:0;z-index:5;background:#fffdf8ee;backdrop-filter:blur(8px);border-bottom:4px solid #b22f2a}.campaign{max-width:760px;margin:auto;padding:9px 12px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}.logo{font-weight:1000;font-size:20px;letter-spacing:.02em;color:#b22f2a}.season{font-size:10px;font-weight:900;color:#1f4f88}.badge{width:58px;height:58px;border-radius:50%;border:4px solid #1f4f88;background:#fff;display:grid;place-items:center;text-align:center;font-weight:1000;font-size:10px;color:#b22f2a;box-shadow:0 2px 0 #d8c8b2}main{max-width:760px;margin:auto;padding:10px}.hero{position:relative;overflow:hidden;border:2px solid #b22f2a;background:#fff;border-radius:18px;padding:17px 14px 14px;text-align:center;box-shadow:0 5px 0 #e2c59f}.hero:before,.hero:after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;background:#1f4f88;opacity:.07}.hero:before{left:-55px;top:-50px}.hero:after{right:-45px;bottom:-55px}.hero h1{position:relative;margin:0;color:#b22f2a;font-size:30px;line-height:1.05;letter-spacing:-.03em}.hero .sub{position:relative;margin-top:6px;font-size:13px;font-weight:900;color:#1f4f88}.ribbon{position:relative;display:inline-block;margin-top:10px;background:#f6d14f;border:2px solid #b58b17;border-radius:999px;padding:5px 13px;font-size:11px;font-weight:1000;color:#5b4000}.plate{width:92px;height:92px;border-radius:50%;background:#fff;border:7px double #d8d8d8;box-shadow:inset 0 0 0 2px #f6f6f6,0 2px 7px #c7b79f;margin:12px auto 0;display:grid;place-items:center;color:#b22f2a;font-weight:1000;font-size:12px;transform:rotate(-5deg)}.panel{background:#fff;border:1px solid #d8c2a4;border-radius:14px;padding:12px;margin:10px 0;box-shadow:0 2px 0 #ead9be}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{font-size:12px;font-weight:900}select,input{width:100%;min-height:42px;margin-top:4px;border:2px solid #1f4f88;border-radius:10px;padding:8px;background:#fff}button,a{display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;border:2px solid #1f4f88;border-radius:10px;background:#fff;color:#1f4f88;font:inherit;font-weight:1000;text-decoration:none;padding:8px}.primary{background:#b22f2a;border-color:#8d1f1c;color:#fff}.yellow{background:#f6d14f;border-color:#b58b17;color:#4a3500}.row{display:flex;gap:8px}.row>*{flex:1}.small{font-size:10px;line-height:1.45;color:#6f6156}.shop{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:9px 0;border-top:1px dashed #d9c5a9}.shop input{width:23px;height:23px;margin:0}.name{font-weight:900}.hidden{display:none!important}.stampboard{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:9px}.stamp{aspect-ratio:1;border-radius:50%;border:2px dashed #b22f2a;background:#fff8f5;display:grid;place-items:center;font-size:10px;font-weight:1000;color:#b22f2a}.stamp.done{background:#b22f2a;color:#fff;border-style:solid}.route{padding:9px 0;border-top:1px dashed #d9c5a9}.tag{display:inline-block;border-radius:999px;padding:2px 7px;font-size:9px;font-weight:900;background:#eef3f8;color:#1f4f88}.summary{background:#fff7d6;border:2px solid #e0b72e;border-radius:10px;padding:8px;font-size:11px;line-height:1.55}.note{font-size:9px;color:#806f60;margin-top:8px}.campaign-copy{font-size:11px;font-weight:900;text-align:center;color:#b22f2a;margin:10px 0 0}@media(max-width:560px){main{padding:7px}.hero h1{font-size:26px}.panel{padding:9px}.campaign{padding:7px 9px}.logo{font-size:17px}}</style></head><body><header><div class="campaign"><div><div class="logo">🍞 秋のパンラッシュ</div><div class="season">AUTUMN BAKERY CAMPAIGN 2026</div></div><div class="badge">期間限定<br>ライト版</div></div></header><main><section class="hero"><h1>秋だ！パンだ！<br>めぐって集めよう！</h1><div class="sub">東海パンMAP 秋の季節キャンペーン</div><div class="ribbon">3〜5店舗で気軽にチャレンジ</div><div class="plate">秋パン<br>達成皿</div><div class="campaign-copy">集めて、めぐって、秋パン満喫。</div></section><section class="panel"><div class="grid"><label>エリア<select id="city"><option>豊田市</option><option>岡崎市</option><option>安城市</option><option>刈谷市</option><option>西尾市</option><option>みよし市</option><option>幸田町</option><option>名古屋市</option><option>長久手市</option><option>日進市</option></select></label><label>コース<select id="course"><option value="3">おためし 3店舗</option><option value="4">満喫 4店舗</option><option value="5">完走 5店舗</option></select></label><label>移動手段<select id="vehicle"><option value="bike">クロスカブ</option><option value="car">車</option></select></label><label>出発時刻<input id="depart" type="time"></label></div><div class="row" style="margin-top:9px"><button id="load" class="primary">対象パン屋を探す</button><button id="locate" class="yellow">現在地取得</button></div><div id="status" class="small" style="margin-top:8px">半日以内を目安に遊べるライト版です。</div></section><section id="pick" class="panel hidden"><strong>行きたい店を選ぶ</strong><div id="shops"></div><button id="plan" class="primary">🍁 秋のパンラッシュ開始</button></section><section id="result" class="panel hidden"><strong>秋のパンラッシュ コース</strong><div id="summary" class="summary"></div><div class="stampboard" id="stamps"></div><div id="route"></div><a id="maps" class="primary" target="_blank" rel="noopener">Googleマップでコースを開く</a><div class="note">※本企画は東海パンMAPのオリジナル季節イベントです。特定企業の公式キャンペーンではありません。</div></section><div class="row"><a href="panrush.html">⚡ 本家パンラッシュへ</a><a href="./">← 東海パンMAPへ</a></div></main><script>const API='https://tokai-pan-api-873562719766.asia-northeast1.run.app';let shops=[],origin=null,$=id=>document.getElementById(id);let d=new Date();d.setMinutes(d.getMinutes()+5);$('depart').value=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function score(p){return((p.rating||0)*20)+Math.min(30,Math.log10((p.userRatingCount||0)+1)*12)}function pt(p){let l=p.location||{};return{lat:+l.latitude,lng:+l.longitude}}function ok(p){return Number.isFinite(p?.lat)&&Number.isFinite(p?.lng)}function dist(a,b){let R=6371,r=x=>x*Math.PI/180,x=Math.sin(r(b.lat-a.lat)/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(r(b.lng-a.lng)/2)**2;return 2*R*Math.asin(Math.sqrt(x))}$('locate').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{origin={lat:p.coords.latitude,lng:p.coords.longitude};$('status').textContent='現在地を取得しました。近い順に組みます。'},e=>$('status').textContent='現在地取得失敗: '+e.message):$('status').textContent='現在地非対応';$('load').onclick=async()=>{let city=$('city').value;$('status').textContent='対象店を探しています…';try{let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({textQuery:'パン屋 愛知県'+city})});if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json();shops=(j.places||[]).filter(p=>(p.types||[]).includes('bakery')&&(p.formattedAddress||'').includes(city)&&!/洋菓子|ケーキ|スイーツ|パティスリー|菓子店/.test(p.displayName?.text||'')).sort((a,b)=>score(b)-score(a)).slice(0,10);$('shops').innerHTML=shops.map((p,i)=>'<label class="shop"><input type="checkbox" data-i="'+i+'" '+(i<5?'checked':'')+'><span><span class="name">'+esc(p.displayName?.text)+'</span><br><span class="small">★'+(p.rating||0)+' 口コミ '+(p.userRatingCount||0)+'件</span></span><span class="tag">候補</span></label>').join('');$('pick').classList.remove('hidden');$('status').textContent=city+'の候補を取得しました。';}catch(e){$('status').textContent='取得失敗: '+e.message}};function order(a){if(!ok(origin))return a;let left=[...a],out=[],cur=origin;while(left.length){let bi=0,bd=1e9;left.forEach((p,i)=>{let q=pt(p),v=ok(q)?dist(cur,q):1e9;if(v<bd){bd=v;bi=i}});let p=left.splice(bi,1)[0];out.push(p);if(ok(pt(p)))cur=pt(p)}return out}function tm(base,m){let[h,n]=base.split(':').map(Number),x=new Date(2000,0,1,h,n+m);return String(x.getHours()).padStart(2,'0')+':'+String(x.getMinutes()).padStart(2,'0')}$('plan').onclick=()=>{let need=+$('course').value;let a=[...document.querySelectorAll('#shops input:checked')].map(x=>shops[+x.dataset.i]);if(a.length<need)return alert(need+'店舗以上選んでください');a=order(a).slice(0,need);let elapsed=0,total=0,cur=origin,base=$('depart').value||'09:00',html='';a.forEach((p,i)=>{let q=pt(p),km=ok(cur)&&ok(q)?dist(cur,q):null;if(km!=null){total+=km;elapsed+=Math.max(2,Math.round(km/($('vehicle').value==='bike'?28:26)*60))}html+='<div class="route"><b>'+(i+1)+'. '+esc(p.displayName?.text)+'</b><div class="small">到着目安 '+tm(base,elapsed)+(km!=null?' ／ 約'+km.toFixed(1)+'km':'')+' ／ 滞在15分</div></div>';elapsed+=15;if(ok(q))cur=q});$('route').innerHTML=html;$('stamps').innerHTML=Array.from({length:5},(_,i)=>'<div class="stamp '+(i<a.length?'done':'')+'">'+(i<a.length?'達成':'STAMP')+'</div>').join('');$('summary').innerHTML='<b>'+a.length+'店舗コース</b><br>終了目安 '+tm(base,elapsed)+(ok(origin)?' ／ 概算 '+total.toFixed(1)+'km':'')+'<br>目安：数時間〜半日で完走するライトチャレンジ';let last=a[a.length-1],q=new URLSearchParams({api:'1',destination:last.formattedAddress||last.displayName?.text||'',travelmode:'driving'});if(ok(origin))q.set('origin',origin.lat+','+origin.lng);if(a.length>1)q.set('waypoints',a.slice(0,-1).map(p=>p.formattedAddress||p.displayName?.text||'').join('|'));$('maps').href='https://www.google.com/maps/dir/?'+q;$('result').classList.remove('hidden');$('result').scrollIntoView({behavior:'smooth'})};</script></body></html>

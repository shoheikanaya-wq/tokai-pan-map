<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>パンラッシュ｜東海パンMAP</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#352d27;background:#f3efe6}*{box-sizing:border-box}body{margin:0;background:#f3efe6}header{padding:10px 12px;background:#f7f0e4;border-bottom:1px solid #dfcfbb}main{max-width:760px;margin:auto;padding:10px}.panel{background:#fff9ed;border:1px solid #d2b98e;border-radius:14px;padding:12px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{font-size:12px;font-weight:700}select,input{width:100%;min-height:42px;margin-top:4px;border:1px solid #b98a55;border-radius:10px;padding:8px;background:#fff}button,a{display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;border:1px solid #b98a55;border-radius:11px;background:#ead3ad;color:#332316;font:inherit;font-weight:800;text-decoration:none;padding:8px}.primary{background:#9b4f36;color:#fffaf2}.row{display:flex;gap:8px}.row>*{flex:1}.shop{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid #eadfce}.shop input{width:23px;height:23px;margin:0}.name{font-weight:800}.small{font-size:10px;color:#71665d}.hidden{display:none!important}.route{padding:9px 0;border-top:1px solid #eadfce}@media(max-width:560px){main{padding:7px}.panel{padding:9px}.name{font-size:12px}}</style></head><body><header><strong>🥐 パンラッシュ</strong><div class="small">東海パンMAP｜巡回計画プロトタイプ</div></header><main><div class="panel"><div class="grid"><label>エリア<select id="city"><option>豊田市</option><option>岡崎市</option><option>安城市</option><option>刈谷市</option><option>西尾市</option><option>みよし市</option><option>幸田町</option><option>豊橋市</option><option>豊川市</option><option>名古屋市</option><option>長久手市</option><option>日進市</option></select></label><label>移動手段<select id="vehicle"><option value="bike">クロスカブ</option><option value="car">車</option></select></label><label>出発時刻<input id="depart" type="time"></label><label>滞在時間(分)<input id="stay" type="number" value="15" min="5" step="5"></label></div><div class="row" style="margin-top:9px"><button id="load" class="primary">TOP10取得</button><button id="locate">現在地取得</button></div><div id="status" class="small" style="margin-top:8px">TOP10を取得してください。</div></div><div id="pick" class="panel hidden"><strong>行きたい店を選択</strong><div id="shops"></div><button id="plan" class="primary">⚡ 巡回計画を作る</button></div><div id="result" class="panel hidden"><strong>パンラッシュ計画</strong><div id="summary" class="small"></div><div id="route"></div><a id="maps" class="primary" target="_blank" rel="noopener">Googleマップで巡回ルートを開く</a></div><a href="./">← 東海パンMAPへ戻る</a></main><script>const API='https://tokai-pan-api-873562719766.asia-northeast1.run.app';let shops=[],origin=null,$=id=>document.getElementById(id);let d=new Date();d.setMinutes(d.getMinutes()+5);$('depart').value=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function score(p){return((p.rating||0)*20)+Math.min(30,Math.log10((p.userRatingCount||0)+1)*12)}function pt(p){let l=p.location||{};return{lat:+l.latitude,lng:+l.longitude}}function ok(p){return Number.isFinite(p?.lat)&&Number.isFinite(p?.lng)}function dist(a,b){let R=6371,r=x=>x*Math.PI/180,x=Math.sin(r(b.lat-a.lat)/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(r(b.lng-a.lng)/2)**2;return 2*R*Math.asin(Math.sqrt(x))}$('locate').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{origin={lat:p.coords.latitude,lng:p.coords.longitude};$('status').textContent='現在地を取得しました。'},e=>$('status').textContent='現在地取得失敗: '+e.message):$('status').textContent='現在地非対応';$('load').onclick=async()=>{let city=$('city').value;$('status').textContent='取得中…';try{let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({textQuery:'パン屋 愛知県'+city})});if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json();shops=(j.places||[]).filter(p=>(p.types||[]).includes('bakery')&&(p.formattedAddress||'').includes(city)&&!/洋菓子|ケーキ|スイーツ|パティスリー|菓子店/.test(p.displayName?.text||'')).sort((a,b)=>score(b)-score(a)).slice(0,10);$('shops').innerHTML=shops.map((p,i)=>'<label class="shop"><input type="checkbox" data-i="'+i+'" checked><span><span class="name">'+esc(p.displayName?.text)+'</span><br><span class="small">★'+(p.rating||0)+' 口コミ '+(p.userRatingCount||0)+'件</span></span><b>'+(i+1)+'位</b></label>').join('');$('pick').classList.remove('hidden');$('status').textContent=city+' TOP'+shops.length+'を取得';}catch(e){$('status').textContent='取得失敗: '+e.message}};function order(a){if(!ok(origin))return a;let left=[...a],out=[],cur=origin;while(left.length){let bi=0,bd=1e9;left.forEach((p,i)=>{let q=pt(p),v=ok(q)?dist(cur,q):1e9;if(v<bd){bd=v;bi=i}});let p=left.splice(bi,1)[0];out.push(p);if(ok(pt(p)))cur=pt(p)}return out}function tm(base,m){let [h,n]=base.split(':').map(Number),x=new Date(2000,0,1,h,n+m);return String(x.getHours()).padStart(2,'0')+':'+String(x.getMinutes()).padStart(2,'0')}$('plan').onclick=()=>{let a=[...document.querySelectorAll('#shops input:checked')].map(x=>shops[+x.dataset.i]);if(!a.length)return alert('店舗を選択してください');a=order(a);let stay=+$('stay').value||15,elapsed=0,total=0,cur=origin,base=$('depart').value||'09:00',html='';a.forEach((p,i)=>{let q=pt(p),km=ok(cur)&&ok(q)?dist(cur,q):null;if(km!=null){total+=km;elapsed+=Math.round(km/($('vehicle').value==='bike'?30:28)*60)}html+='<div class="route"><b>'+(i+1)+'. '+esc(p.displayName?.text)+'</b><div class="small">到着目安 '+tm(base,elapsed)+(km!=null?' ／ 約'+km.toFixed(1)+'km':'')+' ／ 滞在'+stay+'分</div></div>';elapsed+=stay;if(ok(q))cur=q});$('route').innerHTML=html;$('summary').textContent=a.length+'店舗 ／ 終了目安 '+tm(base,elapsed)+(ok(origin)?' ／ 概算 '+total.toFixed(1)+'km':'');let last=a[a.length-1],q=new URLSearchParams({api:'1',destination:last.formattedAddress||last.displayName?.text||'',travelmode:'driving'});if(ok(origin))q.set('origin',origin.lat+','+origin.lng);if(a.length>1)q.set('waypoints',a.slice(0,-1).map(p=>p.formattedAddress||p.displayName?.text||'').join('|'));$('maps').href='https://www.google.com/maps/dir/?'+q;$('result').classList.remove('hidden');$('result').scrollIntoView({behavior:'smooth'})};</script></body></html>

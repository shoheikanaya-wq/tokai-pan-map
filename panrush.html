<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2c2119"><title>パンラッシュ｜24時間耐久チャレンジ</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#f8f1e7;background:#18130f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#34261c,#18130f 45%);color:#f8f1e7}header{position:sticky;top:0;z-index:5;background:#1d1712ee;backdrop-filter:blur(9px);border-bottom:1px solid #60452f}.head{max-width:820px;margin:auto;padding:10px 12px}.title{font-size:20px;font-weight:1000;letter-spacing:.03em}.sub{font-size:10px;color:#c9ad91;margin-top:2px}main{max-width:820px;margin:auto;padding:10px}.hero,.panel{background:#241c16;border:1px solid #6d4e37;border-radius:15px;padding:12px;margin:10px 0;box-shadow:0 4px 18px #0005}.hero{text-align:center;border:2px solid #b56b2f}.hero h1{margin:0;font-size:29px;line-height:1.05}.hero .limit{display:inline-block;margin-top:8px;padding:6px 13px;border-radius:999px;background:#9b2f26;color:#fff;font-weight:1000;font-size:12px}.hero .copy{font-size:11px;color:#d7b995;margin-top:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{font-size:11px;font-weight:800;color:#e8d5c0}select,input{width:100%;min-height:42px;margin-top:4px;border:1px solid #8d674a;border-radius:10px;padding:8px;background:#f8f1e7;color:#2a211b}button,a{display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;border:1px solid #8d674a;border-radius:10px;background:#d0aa79;color:#24160d;font:inherit;font-weight:900;text-decoration:none;padding:8px;cursor:pointer}.primary{background:#9b2f26;border-color:#bf564b;color:#fff}.dark{background:#403124;color:#f8f1e7}.row{display:flex;gap:8px}.row>*{flex:1}.small{font-size:10px;color:#c2ad9a;line-height:1.5}.hidden{display:none!important}.statusbox{margin-top:8px;padding:8px;border-radius:9px;background:#1d1712;border:1px solid #49372a}.danger{color:#ffb5aa}.good{color:#aad6a6}.warn{color:#f1cc76}.challenge{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid #49372a}.challenge b{font-size:13px}.tag{display:inline-block;border-radius:999px;padding:2px 7px;font-size:9px;font-weight:900;background:#49372a;color:#ead7c3;margin:2px 3px 0 0}.route{padding:10px 0;border-top:1px solid #49372a}.route strong{font-size:13px}.time{font-weight:900;color:#ffca75}.summary{font-size:11px;line-height:1.6;padding:9px;border-radius:10px;background:#1d1712;border:1px solid #60452f}.meter{height:12px;background:#120e0b;border-radius:999px;overflow:hidden;border:1px solid #5b4432;margin:8px 0}.meter>div{height:100%;background:linear-gradient(90deg,#8b7c42,#d1702c,#9b2f26);width:0}.shops{max-height:440px;overflow:auto;margin-top:8px}.shop{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid #49372a}.shop input{width:21px;height:21px;margin:0}.shopname{font-size:12px;font-weight:900}.footerlinks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.note{font-size:9px;color:#9f8c7c;margin-top:8px}@media(max-width:560px){main{padding:7px}.hero h1{font-size:25px}.panel{padding:9px}.grid{gap:6px}.title{font-size:18px}}</style></head><body><header><div class="head"><div class="title">⚡ PAN RUSH</div><div class="sub">東海パンMAP｜24時間耐久・上級者向けチャレンジ</div></div></header><main><section class="hero"><h1>24時間で、<br>どこまで喰らいつけるか。</h1><div class="limit">制限時間 24:00</div><div class="copy">ベテラン勢が完走できるかどうかを競う、東海パンMAP最高難度モード。</div></section><section class="panel"><div class="grid"><label>チャレンジ<select id="challenge"><option value="nishi">西三河耐久｜目標25店</option><option value="mikawa">三河縦断｜目標35店</option><option value="aichi">愛知横断｜目標50店</option></select></label><label>移動手段<select id="vehicle"><option value="bike">クロスカブ</option><option value="car">車</option></select></label><label>スタート時刻<input id="depart" type="time"></label><label>1店舗滞在<input id="stay" type="number" value="10" min="5" max="30" step="5"></label></div><div class="row" style="margin-top:9px"><button id="load" class="primary">候補店を一括取得</button><button id="locate" class="dark">現在地取得</button></div><div id="status" class="statusbox small">候補を取得すると、複数市町村から耐久用の店舗プールを作成します。</div></section><section id="pick" class="panel hidden"><strong>挑戦店舗</strong><div id="challengeInfo" class="small"></div><div class="row" style="margin-top:8px"><button id="goalOn">目標数を自動選択</button><button id="allOff" class="dark">全部外す</button></div><div id="shops" class="shops"></div><button id="plan" class="primary" style="margin-top:9px">🔥 24時間パンラッシュ計画を作る</button></section><section id="result" class="panel hidden"><strong>耐久計画</strong><div id="summary" class="summary"></div><div class="meter"><div id="meterbar"></div></div><div id="route"></div><div class="statusbox small"><span class="warn">注意：</span>現在は直線距離ベースの概算。実道路、渋滞、休憩、売り切れ、臨時休業、駐車・入店待ちを含めると実時間は増えます。24時間判定は暫定シミュレーションです。</div><a id="maps" class="primary" target="_blank" rel="noopener" style="margin-top:9px">Googleマップで先頭区間を開く</a></section><div class="footerlinks"><a href="autumn-rush.html">🍁 秋のパンラッシュ</a><a href="./">← 東海パンMAP</a></div></main><script>const API='https://tokai-pan-api-873562719766.asia-northeast1.run.app';const SETS={nishi:{name:'西三河耐久',goal:25,cities:['豊田市','岡崎市','安城市','刈谷市','西尾市','碧南市','知立市','みよし市','幸田町']},mikawa:{name:'三河縦断',goal:35,cities:['豊田市','岡崎市','安城市','刈谷市','西尾市','豊橋市','豊川市','蒲郡市','新城市','田原市']},aichi:{name:'愛知横断',goal:50,cities:['豊田市','岡崎市','安城市','刈谷市','西尾市','豊橋市','豊川市','名古屋市','一宮市','春日井市','長久手市','日進市','半田市','常滑市','大府市']}};let shops=[],origin=null,$=id=>document.getElementById(id);let now=new Date();now.setMinutes(now.getMinutes()+5);$('depart').value=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function score(p){return((p.rating||0)*20)+Math.min(30,Math.log10((p.userRatingCount||0)+1)*12)}function pt(p){let l=p.location||{};return{lat:+l.latitude,lng:+l.longitude}}function ok(p){return Number.isFinite(p?.lat)&&Number.isFinite(p?.lng)}function dist(a,b){let R=6371,r=x=>x*Math.PI/180,x=Math.sin(r(b.lat-a.lat)/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(r(b.lng-a.lng)/2)**2;return 2*R*Math.asin(Math.sqrt(x))}function uniq(list){let m=new Map();list.forEach(p=>{let k=p.id||(p.displayName?.text+'|'+p.formattedAddress);if(!m.has(k))m.set(k,p)});return[...m.values()]}async function cityFetch(city){let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({textQuery:'パン屋 愛知県'+city})});if(!r.ok)throw Error(city+' HTTP '+r.status);let j=await r.json();return(j.places||[]).filter(p=>(p.types||[]).includes('bakery')&&(p.formattedAddress||'').includes(city)&&!/洋菓子|ケーキ|スイーツ|パティスリー|菓子店/.test(p.displayName?.text||'')).map(p=>({...p,_city:city}))}$('locate').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{origin={lat:p.coords.latitude,lng:p.coords.longitude};$('status').textContent='現在地取得済み。開始地点から巡回順を組みます。'},e=>$('status').textContent='現在地取得失敗: '+e.message,{enableHighAccuracy:true,timeout:10000}):$('status').textContent='現在地非対応';$('load').onclick=async()=>{let cfg=SETS[$('challenge').value];$('status').textContent=cfg.cities.length+'地域から候補取得中…';$('result').classList.add('hidden');try{let groups=[];for(let i=0;i<cfg.cities.length;i++){let city=cfg.cities[i];$('status').textContent='候補取得中 '+(i+1)+'/'+cfg.cities.length+'：'+city;try{groups.push(await cityFetch(city))}catch(e){console.warn(e)}}shops=uniq(groups.flat()).sort((a,b)=>score(b)-score(a)||((b.userRatingCount||0)-(a.userRatingCount||0)));$('challengeInfo').textContent=cfg.name+'｜目標 '+cfg.goal+'店｜候補 '+shops.length+'店';$('shops').innerHTML=shops.map((p,i)=>'<label class="shop"><input type="checkbox" data-i="'+i+'" '+(i<cfg.goal?'checked':'')+'><span><span class="shopname">'+esc(p.displayName?.text)+'</span><br><span class="small">'+esc(p._city)+' ／ ★'+(p.rating||0)+' ／ 口コミ '+(p.userRatingCount||0)+'</span></span><span class="tag">'+(i+1)+'</span></label>').join('');$('pick').classList.remove('hidden');$('status').innerHTML='<span class="good">取得完了。</span> '+cfg.name+' 候補 '+shops.length+'店';}catch(e){$('status').innerHTML='<span class="danger">取得失敗：</span>'+esc(e.message)}};$('goalOn').onclick=()=>{let goal=SETS[$('challenge').value].goal;document.querySelectorAll('#shops input').forEach((x,i)=>x.checked=i<goal)};$('allOff').onclick=()=>document.querySelectorAll('#shops input').forEach(x=>x.checked=false);function order(a){if(!ok(origin))return a;let left=[...a],out=[],cur=origin;while(left.length){let bi=0,bd=1e9;left.forEach((p,i)=>{let q=pt(p),v=ok(q)?dist(cur,q):1e9;if(v<bd){bd=v;bi=i}});let p=left.splice(bi,1)[0];out.push(p);if(ok(pt(p)))cur=pt(p)}return out}function tm(base,m){let[h,n]=base.split(':').map(Number),x=new Date(2000,0,1,h,n+m);let day=Math.floor((h*60+n+m)/1440);return(day?('+'+day+'日 '):'')+String(x.getHours()).padStart(2,'0')+':'+String(x.getMinutes()).padStart(2,'0')}$('plan').onclick=()=>{let cfg=SETS[$('challenge').value],a=[...document.querySelectorAll('#shops input:checked')].map(x=>shops[+x.dataset.i]);if(!a.length)return alert('挑戦店舗を選択してください');a=order(a);let stay=Math.max(5,+$('stay').value||10),elapsed=0,total=0,cur=origin,base=$('depart').value||'06:00',html='';a.forEach((p,i)=>{let q=pt(p),km=ok(cur)&&ok(q)?dist(cur,q):null;if(km!=null){total+=km;let speed=$('vehicle').value==='bike'?32:30;elapsed+=Math.max(2,Math.round(km/speed*60))}html+='<div class="route"><strong>'+(i+1)+'. '+esc(p.displayName?.text)+'</strong><div class="small">'+esc(p._city)+' ／ <span class="time">到着 '+tm(base,elapsed)+'</span>'+(km!=null?' ／ 約'+km.toFixed(1)+'km':'')+' ／ 滞在 '+stay+'分</div></div>';elapsed+=stay;if(ok(q))cur=q});let hours=elapsed/60,goalHit=a.length>=cfg.goal,timeHit=elapsed<=1440,judgement=goalHit&&timeHit?'暫定クリア圏':'未達見込み';let cls=goalHit&&timeHit?'good':'danger';$('route').innerHTML=html;$('summary').innerHTML='<b>'+cfg.name+'｜'+a.length+'店舗</b><br>目標 '+cfg.goal+'店 ／ 概算所要 '+hours.toFixed(1)+'時間 ／ 終了 '+tm(base,elapsed)+(ok(origin)?'<br>直線距離ベース 約'+total.toFixed(1)+'km':'')+'<br><span class="'+cls+'">判定：'+judgement+'</span>'+(a.length<cfg.goal?'<br>目標まであと '+(cfg.goal-a.length)+'店':'')+(elapsed>1440?'<br>24時間超過 約'+((elapsed-1440)/60).toFixed(1)+'時間':'');$('meterbar').style.width=Math.min(100,elapsed/1440*100)+'%';let first=a.slice(0,9),last=first[first.length-1],q=new URLSearchParams({api:'1',destination:last.formattedAddress||last.displayName?.text||'',travelmode:'driving'});if(ok(origin))q.set('origin',origin.lat+','+origin.lng);if(first.length>1)q.set('waypoints',first.slice(0,-1).map(p=>p.formattedAddress||p.displayName?.text||'').join('|'));$('maps').href='https://www.google.com/maps/dir/?'+q;$('result').classList.remove('hidden');$('result').scrollIntoView({behavior:'smooth'})};</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#9b4f36"><title>パンラッシュ｜東海パンMAP</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#352d27;background:#f3efe6}*{box-sizing:border-box}body{margin:0;background:#f3efe6}header{position:sticky;top:0;z-index:5;padding:10px 12px;background:#f7f0e4ee;backdrop-filter:blur(8px);border-bottom:1px solid #dfcfbb}main{max-width:760px;margin:auto;padding:10px}.panel{background:#fff9ed;border:1px solid #d2b98e;border-radius:14px;padding:12px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{font-size:12px;font-weight:700}select,input{width:100%;min-height:42px;margin-top:4px;border:1px solid #b98a55;border-radius:10px;padding:8px;background:#fff}button,a{display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;border:1px solid #b98a55;border-radius:11px;background:#ead3ad;color:#332316;font:inherit;font-weight:800;text-decoration:none;padding:8px;cursor:pointer}.primary{background:#9b4f36;color:#fffaf2}.row{display:flex;gap:8px}.row>*{flex:1}.shop{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid #eadfce}.shop input{width:23px;height:23px;margin:0}.name{font-weight:800}.small{font-size:10px;color:#71665d;line-height:1.45}.hidden{display:none!important}.route{padding:10px 0;border-top:1px solid #eadfce}.tag{display:inline-block;border-radius:999px;padding:2px 7px;margin:2px 3px 0 0;font-size:9px;font-weight:800;background:#eee3d3}.open{background:#dcebd8;color:#275829}.closed{background:#f0d8d3;color:#7a2c23}.unknown{background:#e8e3db;color:#665c52}.warn{margin-top:7px;padding:8px;border-radius:9px;background:#f6e5cd;color:#6b451d;font-size:10px}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.summarybox{font-size:11px;line-height:1.6;padding:8px;border-radius:9px;background:#f7efe2}.route strong{font-size:13px}.route .time{font-weight:800;color:#7f3f2b}@media(max-width:560px){main{padding:7px}.panel{padding:9px}.name{font-size:12px}.grid{gap:6px}.row{gap:6px}}</style></head><body><header><strong>🥐 パンラッシュ</strong><div class="small">東海パンMAP｜パン屋巡回ルート作成</div></header><main><div class="panel"><div class="grid"><label>エリア<select id="city"><option>豊田市</option><option>岡崎市</option><option>安城市</option><option>刈谷市</option><option>西尾市</option><option>碧南市</option><option>知立市</option><option>高浜市</option><option>みよし市</option><option>幸田町</option><option>豊橋市</option><option>豊川市</option><option>蒲郡市</option><option>新城市</option><option>田原市</option><option>名古屋市</option><option>一宮市</option><option>春日井市</option><option>日進市</option><option>長久手市</option><option>半田市</option><option>常滑市</option><option>大府市</option></select></label><label>移動手段<select id="vehicle"><option value="bike">クロスカブ</option><option value="car">車</option></select></label><label>出発時刻<input id="depart" type="time"></label><label>1店舗の滞在<input id="stay" type="number" value="15" min="5" max="90" step="5"></label></div><div class="row" style="margin-top:9px"><button id="load" class="primary">TOP10取得</button><button id="locate">現在地取得</button></div><div id="status" class="small" style="margin-top:8px">①TOP10取得 → ②現在地取得 → ③店を選択、の順で使えます。</div></div><div id="pick" class="panel hidden"><strong>行きたい店を選択</strong><div class="toolbar"><button id="allOn">全部選ぶ</button><button id="allOff">全部外す</button></div><div id="shops"></div><button id="plan" class="primary">⚡ パンラッシュ計画を作る</button></div><div id="result" class="panel hidden"><strong>パンラッシュ計画</strong><div id="summary" class="summarybox"></div><div id="route"></div><div class="warn">現在の初期版は、直線距離から移動時間を概算しています。Googleマップを開いた後の実道路ルート・渋滞時間が最終判断です。クロスカブもGoogleマップ上では自動車ルートとして開きます。</div><a id="maps" class="primary" target="_blank" rel="noopener" style="margin-top:9px">Googleマップで巡回ルートを開く</a></div><a href="./">← 東海パンMAPへ戻る</a></main><script>const API='https://tokai-pan-api-873562719766.asia-northeast1.run.app';let shops=[],origin=null,$=id=>document.getElementById(id);let d=new Date();d.setMinutes(d.getMinutes()+5);$('depart').value=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function score(p){return((p.rating||0)*20)+Math.min(30,Math.log10((p.userRatingCount||0)+1)*12)}function pt(p){let l=p.location||{};return{lat:+l.latitude,lng:+l.longitude}}function ok(p){return Number.isFinite(p?.lat)&&Number.isFinite(p?.lng)}function dist(a,b){let R=6371,r=x=>x*Math.PI/180,x=Math.sin(r(b.lat-a.lat)/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(r(b.lng-a.lng)/2)**2;return 2*R*Math.asin(Math.sqrt(x))}function openState(p){let v=p.currentOpeningHours?.openNow;if(v===true)return['営業中','open'];if(v===false)return['営業時間外','closed'];return['営業状況不明','unknown']}function hoursToday(p){let a=p.regularOpeningHours?.weekdayDescriptions||[];if(!a.length)return'';let idx=(new Date().getDay()+6)%7;return a[idx]||''}$('locate').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{origin={lat:p.coords.latitude,lng:p.coords.longitude};$('status').textContent='現在地を取得しました。巡回順を現在地から最適化できます。'},e=>$('status').textContent='現在地取得失敗: '+e.message,{enableHighAccuracy:true,timeout:10000}):$('status').textContent='現在地非対応';$('load').onclick=async()=>{let city=$('city').value;$('status').textContent='取得中…';$('result').classList.add('hidden');try{let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({textQuery:'パン屋 愛知県'+city})});if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json();shops=(j.places||[]).filter(p=>(p.types||[]).includes('bakery')&&(p.formattedAddress||'').includes(city)&&!/洋菓子|ケーキ|スイーツ|パティスリー|菓子店/.test(p.displayName?.text||'')).sort((a,b)=>score(b)-score(a)||((b.userRatingCount||0)-(a.userRatingCount||0))).slice(0,10);$('shops').innerHTML=shops.map((p,i)=>{let [st,cl]=openState(p),today=hoursToday(p);return'<label class="shop"><input type="checkbox" data-i="'+i+'" checked><span><span class="name">'+esc(p.displayName?.text)+'</span><br><span class="small">★'+(p.rating||0)+' 口コミ '+(p.userRatingCount||0)+'件'+(today?'<br>'+esc(today):'')+'</span><span class="tag '+cl+'">'+st+'</span></span><b>'+(i+1)+'位</b></label>'}).join('');$('pick').classList.remove('hidden');$('status').textContent=city+' TOP'+shops.length+'を取得しました。';}catch(e){$('status').textContent='取得失敗: '+e.message}};$('allOn').onclick=()=>document.querySelectorAll('#shops input').forEach(x=>x.checked=true);$('allOff').onclick=()=>document.querySelectorAll('#shops input').forEach(x=>x.checked=false);function order(a){if(!ok(origin))return a;let left=[...a],out=[],cur=origin;while(left.length){let bi=0,bd=1e9;left.forEach((p,i)=>{let q=pt(p),v=ok(q)?dist(cur,q):1e9;if(v<bd){bd=v;bi=i}});let p=left.splice(bi,1)[0];out.push(p);if(ok(pt(p)))cur=pt(p)}return out}function tm(base,m){let[h,n]=base.split(':').map(Number),x=new Date(2000,0,1,h,n+m);return String(x.getHours()).padStart(2,'0')+':'+String(x.getMinutes()).padStart(2,'0')}function minsFromStart(base,m){return tm(base,m)}$('plan').onclick=()=>{let a=[...document.querySelectorAll('#shops input:checked')].map(x=>shops[+x.dataset.i]);if(!a.length)return alert('店舗を選択してください');a=order(a);let stay=Math.max(5,+$('stay').value||15),elapsed=0,total=0,cur=origin,base=$('depart').value||'09:00',html='',closedCount=0,unknownCount=0;a.forEach((p,i)=>{let q=pt(p),km=ok(cur)&&ok(q)?dist(cur,q):null;if(km!=null){total+=km;let speed=$('vehicle').value==='bike'?30:28;elapsed+=Math.max(2,Math.round(km/speed*60))}let arrival=minsFromStart(base,elapsed),[st,cl]=openState(p);if(cl==='closed')closedCount++;if(cl==='unknown')unknownCount++;html+='<div class="route"><strong>'+(i+1)+'. '+esc(p.displayName?.text)+'</strong><div class="small"><span class="time">到着目安 '+arrival+'</span>'+(km!=null?' ／ 約'+km.toFixed(1)+'km':'')+' ／ 滞在 '+stay+'分</div><span class="tag '+cl+'">'+st+'</span>'+(hoursToday(p)?'<div class="small">'+esc(hoursToday(p))+'</div>':'')+'</div>';elapsed+=stay;if(ok(q))cur=q});$('route').innerHTML=html;let mode=$('vehicle').value==='bike'?'クロスカブ':'車';$('summary').innerHTML='<b>'+a.length+'店舗 ／ '+mode+'</b><br>終了目安 '+tm(base,elapsed)+(ok(origin)?' ／ 直線距離ベース 約'+total.toFixed(1)+'km':' ／ 現在地未取得のため順位順')+(closedCount?'<br>⚠ 営業時間外表示 '+closedCount+'店':'')+(unknownCount?'<br>△ 営業状況不明 '+unknownCount+'店':'');let last=a[a.length-1],q=new URLSearchParams({api:'1',destination:last.formattedAddress||last.displayName?.text||'',travelmode:'driving'});if(ok(origin))q.set('origin',origin.lat+','+origin.lng);if(a.length>1)q.set('waypoints',a.slice(0,-1).map(p=>p.formattedAddress||p.displayName?.text||'').join('|'));$('maps').href='https://www.google.com/maps/dir/?'+q;$('result').classList.remove('hidden');$('result').scrollIntoView({behavior:'smooth'})};</script></body></html>
